/* auth gate — compact GATC sign-in (desktop ≤100vh, no hero art) */
.auth-shell{--navy:#001A3D;--royal:#0056D2;--royal-deep:#0046b0;--sky:#5eb0ff;--cyan:#00AEEF;--wa:#25D366;--wa-deep:#1da851;--ink:#142033;--muted:#667789;--line:#e4ebf3;--soft:#f4f7fb;height:100vh;height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#f3f6fb 0%,#e8eef6 100%);font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.auth-shell *{box-sizing:border-box}
.auth-hero{position:relative;overflow:hidden;flex:none;color:#fff;background:linear-gradient(135deg,#001226 0%,#001A3D 48%,#0a3a8a 82%,#0056D2 100%);padding:12px 16px 28px}
.auth-hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 80% at 90% 30%,rgba(94,176,255,.26),transparent 60%),radial-gradient(ellipse 40% 50% at 10% 100%,rgba(37,211,102,.08),transparent 55%)}
.auth-hero-grid{position:absolute;inset:0;opacity:.1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 100%)}
.auth-hero-inner{position:relative;z-index:1;display:grid;gap:8px;max-width:920px;margin:0 auto;width:100%}
.auth-brand{display:flex;align-items:center;gap:10px;animation:auth-rise .55s ease both}
.auth-logo{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1a4f9c,#0b2a5c 70%);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.28)}
.auth-logo svg{width:22px;height:22px}
.auth-brand-text{font-family:Outfit,system-ui,sans-serif;color:#fff;line-height:1.12}
.auth-brand-text .brand-name{display:block;font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.auth-brand-text .brand-sub{display:inline-block;font-weight:650;font-size:9px;letter-spacing:.11em;text-transform:uppercase;opacity:.92;border-bottom:2px solid var(--wa);padding-bottom:1px;margin-top:2px}
.auth-hero-copy{animation:auth-rise .6s .05s ease both}
.auth-hero-copy h1{margin:0;font-family:Outfit,system-ui,sans-serif;font-weight:800;font-size:clamp(1.15rem,2.6vw,1.45rem);letter-spacing:-.03em;line-height:1.15;max-width:28ch}
.auth-hero-copy h1 .accent{color:var(--cyan)}
.auth-hero-copy p{margin:5px 0 0;font-size:12.5px;line-height:1.4;color:#c7d7ef;max-width:46ch}
.auth-hero-art{display:none!important}
.auth-wave{position:absolute;left:0;right:0;bottom:-1px;height:18px;z-index:2;color:#f3f6fb}
.auth-wave svg{display:block;width:100%;height:100%}
.auth-badge-wrap{position:relative;z-index:3;display:flex;justify-content:center;margin-top:-16px;margin-bottom:-6px;pointer-events:none}
.auth-badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#1a6dff,#0056D2 55%,#003f9e);box-shadow:0 0 0 4px #f3f6fb,0 6px 16px rgba(0,86,210,.4);animation:auth-pulse 2.8s ease-in-out infinite}
.auth-badge svg{width:18px;height:18px;color:#fff}
.auth-card-wrap{flex:1;min-height:0;padding:4px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;overflow:hidden}
.auth-stack{width:min(100%,400px);display:flex;flex-direction:column;gap:10px;flex:none;animation:auth-rise .55s .08s ease both}
.auth-card{width:100%;background:#fff;border:1px solid rgba(228,235,243,.9);border-radius:14px;padding:12px 16px 10px;box-shadow:0 14px 32px rgba(10,30,70,.09),0 2px 0 rgba(255,255,255,.8) inset}


.auth-step .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e8eef6;color:#7d8b9d;font-size:10px;font-weight:800}
.auth-step.on .num{background:var(--royal);color:#fff;box-shadow:0 3px 8px rgba(0,86,210,.32)}
.auth-step.done .num{background:var(--wa);color:#fff}


.auth-card h2{margin:0 0 2px;font-family:Outfit,system-ui,sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.auth-card .auth-sub{margin:0 0 8px;font-size:12.5px;color:var(--muted);line-height:1.35}
.auth-error{background:#fff1f0;color:#b42318;border:1px solid #f3c6c2;border-radius:9px;padding:7px 9px;font-size:12px;margin-bottom:8px}
.auth-notice{background:#eef7ff;color:#0b4fad;border:1px solid #cfe3ff;border-radius:9px;padding:7px 9px;font-size:12px;margin-bottom:8px}
.auth-field{margin-top:8px}.auth-field:first-of-type{margin-top:0}
.auth-field-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.auth-field-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#243147;margin:0}
.auth-field-label .aadhaar-mark{display:inline-flex;align-items:center;justify-content:center;height:16px;padding:0 5px;border-radius:3px;background:linear-gradient(90deg,#ff9933 0 33%,#fff 33% 66%,#138808 66%);font-size:0;width:26px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #c9d0d8}
.auth-field-label .aadhaar-mark::after{content:"AADHAAR";position:absolute;inset:0;display:grid;place-items:center;font-size:5px;font-weight:800;letter-spacing:.04em;color:#0b3d91;background:rgba(255,255,255,.72)}
.auth-pill{font-size:10px;font-weight:700;color:#6b7c90;background:#eef3f9;border:1px solid #e0e8f1;border-radius:99px;padding:2px 8px}
.auth-field-meta{font-size:11px;font-weight:600;color:#93a1b3}
.auth-input{display:flex;align-items:center;gap:8px;border:1px solid #d5deea;border-radius:10px;background:#fff;padding:0 10px;min-height:40px;color:#8896a8;transition:border-color .15s,box-shadow .15s}
.auth-input:focus-within{border-color:#7eb0ff;box-shadow:0 0 0 3px rgba(0,86,210,.14)}
.auth-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:#142033;height:38px;font-family:inherit;letter-spacing:.03em}
.auth-input input::placeholder{color:#a8b3c2;letter-spacing:.12em}
.auth-input .icon-btn{border:0;background:transparent;color:#8896a8;display:grid;place-items:center;padding:4px;cursor:pointer;border-radius:8px}
.auth-input .icon-btn:hover{color:var(--royal);background:#f0f5ff}
.auth-forgot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.auth-forgot,.auth-help{border:0;background:none;color:var(--royal);font-size:12px;font-weight:700;cursor:pointer;padding:0;font-family:inherit}
.auth-forgot:hover,.auth-help:hover{text-decoration:underline}

</style></head><body class="desktop"><div id="app"></div><script>(() => {
  const TOKEN_KEY = 'gatc_rc_admin_token';
  const USER_KEY = 'gatc_rc_admin_user';
  // Empty = same-origin (Vite proxies /api → :3000; production/backend serve UI+API together).
  // Pure static preview without a proxy: set to 'http://127.0.0.1:3000' (local) or
  // 'https://gatc.yesweigh.in' (live; requires that host allow this origin via CORS).
  const API_BASE = '';
  const appRoot = document.getElementById('app');

  function authIcon(paths){return `<svg aria-hidden="true" class="i lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  async function api(path, { method='GET', body, token } = {}) {
    const headers = { 'content-type': 'application/json' };
    if (token) headers.authorization = `Bearer ${token}`;
    const res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const json = await res.json().catch(() => ({}));
    return { res, json };
  }

  function clearAuth() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
  }

  function formatAadhaarInput(raw) {
    const digits = String(raw || '').replace(/\D/g, '').slice(0, 12);
    return digits.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
  }


  function renderLogin(state) {
    const step = state.step || 'credentials';
    const err = state.error ? `<div class="auth-error" role="alert">${escapeHtml(state.error)}</div>` : '';
    const notice = state.notice ? `<div class="auth-notice" role="status">${escapeHtml(state.notice)}</div>` : '';

    const svg = (paths, cls='i', attrs='') => `<svg aria-hidden="true" class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" ${attrs}>${paths}</svg>`;
    const lockIcon = svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
    const idIcon = svg('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.2"/><path d="M14 10h5M14 14h4"/>');
    const eyeIcon = svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>');
    const eyeOffIcon = svg('<path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-1.2M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-4.2 4.7M6.1 6.1C3.7 7.9 2 12 2 12a18 18 0 0 0 6.3 5.5"/>');
    const arrowIcon = svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
    const checkIcon = svg('<path d="M20 6 9 17l-5-5"/>', 'i', 'stroke-width="2.4"');
    const serverIcon = svg('<rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01M12 6.5h4M12 17.5h4"/>');
    const waIcon = `<svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.55 2 2.1 6.45 2.1 11.94c0 1.76.46 3.47 1.34 4.98L2 22l5.25-1.38c1.45.79 3.08 1.21 4.77 1.21h.01c5.49 0 9.94-4.45 9.94-9.94a9.86 9.86 0 0 0-2.92-6.98Zm-7.01 15.24h-.01a8.22 8.22 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.39c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.41 5.83c0 4.55-3.7 8.24-8.24 8.24Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.8-.23-.09-.39-.12-.56.12-.16.25-.64.8-.78.96-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></svg>`;
    const logoMark = `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="#7eb6ff" stroke-width="2.2"/><circle cx="24" cy="24" r="13.5" fill="none" stroke="#d6e8ff" stroke-width="1.4" opacity=".7"/><path d="M24 11v13l8 4" stroke="#9fd0ff" stroke-width="2.2" stroke-linecap="round"/><circle cx="24" cy="24" r="2.4" fill="#25D366"/><path d="M17.5 25.2 21.4 29l8.4-9.2" fill="none" stroke="#25D366" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const shieldBadge = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 20 6v5.8c0 4.7-3.4 7.8-8 9.7-4.6-1.9-8-5-8-9.7V6l8-3.5Z" fill="rgba(255,255,255,.14)" stroke="currentColor" stroke-width="1.6"/><rect x="9.2" y="10.2" width="5.6" height="5" rx="1.2" fill="#fff"/><path d="M10.4 10.2V9a1.6 1.6 0 0 1 3.2 0v1.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const features = `<div class="auth-features" aria-label="Security features">
      <div class="auth-feat"><div class="auth-feat-ico">${serverIcon}</div><b>Secure VPS Auth</b></div>
      <div class="auth-feat"><div class="auth-feat-ico">${lockIcon}</div><b>TLS Encryption</b></div>
      <div class="auth-feat"><div class="auth-feat-ico">${checkIcon}</div><b>Password Login</b></div>
    </div>`;

    const trust = `<div class="auth-trust">${svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 2.8 2.8L16.5 9"/>','i','stroke-width="2"')}<span>Secure Server • Encrypted Data • Password Sign-In</span></div>`;
    const footChip = (paths, label, cls='') => `<span class="auth-foot-chip ${cls}">${svg(paths,'i','stroke-width="2"')}${label}</span>`;
    const authFoot = `<footer class="auth-foot">
      <div class="auth-foot-brand"><span class="auth-foot-title">GATC – Government Approved Test Center (Calibration)</span></div>
      <p class="auth-foot-co">Interweighing Pvt Ltd</p>
      <div class="auth-foot-chips" aria-hidden="true">
        ${footChip('<rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01"/>','Secure VPS')}
        ${footChip('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>','Encrypted')}
        ${footChip('<path d="M20 6 9 17l-5-5"/>','Password')}
      </div>
    </footer>`;

    const shell = (cardBody, extras='') => `<div class="auth-shell">
      <header class="auth-hero">
        <div class="auth-hero-glow" aria-hidden="true"></div>
        <div class="auth-hero-grid" aria-hidden="true"></div>
        <div class="auth-hero-inner">
          <div class="auth-brand">
            <div class="auth-logo">${logoMark}</div>
            <div class="auth-brand-text"><span class="brand-name">GATC</span><span class="brand-sub">Calibration &amp; Verification System</span></div>
          </div>
          <div class="auth-hero-copy">
            <h1>Secure Access for <span class="accent">Calibration</span> Operations</h1>
            <p>Manage calibration, verification, and certificates with a secure password login.</p>
          </div>
        </div>
        <div class="auth-wave" aria-hidden="true"><svg viewBox="0 0 1440 48" preserveAspectRatio="none"><path fill="currentColor" d="M0,22 C240,48 480,0 720,18 C960,36 1200,48 1440,20 L1440,48 L0,48 Z"/></svg></div>
      </header>
      <div class="auth-badge-wrap"><div class="auth-badge">${shieldBadge}</div></div>
      <div class="auth-card-wrap">
        <div class="auth-stack">
          <div class="auth-card">${cardBody}${extras}</div>
          ${authFoot}
        </div>
      </div>
    </div>`;

    const aadhaarValue = escapeHtml(formatAadhaarInput(state.aadhaar || ''));
    appRoot.innerHTML = shell(`
      <h2>Sign In to GATC</h2>
      <p class="auth-sub">Enter Aadhaar and password to continue.</p>
      ${err}${notice}
      <form id="login-form" autocomplete="on">
        <div class="auth-field">
          <div class="auth-field-head">
            <label class="auth-field-label" for="aadhaar"><span class="aadhaar-mark" aria-hidden="true"></span> Aadhaar Number</label>
            <span class="auth-pill">12-digit</span>
          </div>
          <div class="auth-input">${idIcon}<input id="aadhaar" name="aadhaar" inputmode="numeric" autocomplete="username" maxlength="14" required placeholder="XXXX XXXX XXXX" value="${aadhaarValue}" /><button type="button" class="icon-btn" id="toggle-aadhaar" aria-label="Hide Aadhaar">${eyeOffIcon}</button></div>
        </div>
        <div class="auth-field">
          <div class="auth-field-head">
            <label class="auth-field-label" for="password">${lockIcon} Password</label>
            <span class="auth-field-meta">Account protection</span>
          </div>
          <div class="auth-input">${lockIcon}<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" /><button type="button" class="icon-btn" id="toggle-password" aria-label="Show password">${eyeIcon}</button></div>
          <div class="auth-forgot-row">
            <button type="button" class="auth-forgot" id="forgot-link">Forgot Password?</button>
            <button type="button" class="auth-help" id="help-link">Need Help?</button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="login-submit"><span>Sign in</span> ${arrowIcon}</button>
      </form>`, `${trust}${features}`);

    const aadhaarInput = appRoot.querySelector('#aadhaar');
    aadhaarInput?.focus();
    aadhaarInput?.addEventListener('input', () => {
      const start = aadhaarInput.selectionStart;
      const before = aadhaarInput.value;
      aadhaarInput.value = formatAadhaarInput(aadhaarInput.value);
      if (typeof start === 'number') {
        const delta = aadhaarInput.value.length - before.length;
        aadhaarInput.setSelectionRange(start + delta, start + delta);
      }
    });
    appRoot.querySelector('#forgot-link')?.addEventListener('click', () => {
      renderLogin({ step: 'credentials', aadhaar: aadhaarInput?.value || '', notice: 'Ask an administrator to reset your password.', error: null });
    });
    appRoot.querySelector('#help-link')?.addEventListener('click', () => {
      renderLogin({ step: 'credentials', aadhaar: aadhaarInput?.value || '', notice: 'Contact your GATC administrator for account help.', error: null });
    });
    let aadhaarHidden = false;
    appRoot.querySelector('#toggle-aadhaar')?.addEventListener('click', () => {
      const input = appRoot.querySelector('#aadhaar');
      const btn = appRoot.querySelector('#toggle-aadhaar');
      if (!input || !btn) return;
      aadhaarHidden = !aadhaarHidden;
      input.style.webkitTextSecurity = aadhaarHidden ? 'disc' : '';
      input.style.textSecurity = aadhaarHidden ? 'disc' : '';
      btn.innerHTML = aadhaarHidden ? eyeIcon : eyeOffIcon;
      btn.setAttribute('aria-label', aadhaarHidden ? 'Show Aadhaar' : 'Hide Aadhaar');
    });
    appRoot.querySelector('#toggle-password')?.addEventListener('click', () => {
      const input = appRoot.querySelector('#password');
      const btn = appRoot.querySelector('#toggle-password');
      if (!input || !btn) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? eyeOffIcon : eyeIcon;
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
    appRoot.querySelector('#login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const aadhaar = (appRoot.querySelector('#aadhaar')?.value || '').replace(/\D/g, '');
      const password = appRoot.querySelector('#password')?.value || '';
      const submit = appRoot.querySelector('#login-submit');
      if (aadhaar.length !== 12) {
        renderLogin({ step: 'credentials', aadhaar, error: 'Enter a valid 12-digit Aadhaar number' });
        return;
      }
      if (submit) submit.disabled = true;
      const { res, json } = await api('/api/v1/auth/login', { method: 'POST', body: { aadhaar, password } });
      if (!res.ok) {
        renderLogin({ step: 'credentials', aadhaar, error: json.error?.message || 'Login failed' });
        return;
      }
      if (!json.data?.token) {
        renderLogin({ step: 'credentials', aadhaar, error: 'Login succeeded but no session token was returned' });
        return;
      }
      localStorage.setItem(TOKEN_KEY, json.data.token);
      localStorage.setItem(USER_KEY, JSON.stringify(json.data.user || {}));
      bootApp(json.data.token, json.data.user || {});
    });
  }


  async function ensureSession() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
      renderLogin({ step: 'credentials' });
      return;
    }
    const { res, json } = await api('/api/v1/auth/me', { token });
    if (!res.ok) {
      clearAuth();
      renderLogin({
        step: 'credentials',
        error: json.error?.code === 'SESSION_REVOKED'
          ? 'Signed in on another device. Please sign in again.'
          : 'Session expired. Please sign in again.',
      });
      return;
    }
    localStorage.setItem(USER_KEY, JSON.stringify(json.data.user || {}));
    bootApp(token, json.data.user || {});
  }

    const I = {

      scale:'<circle cx="12" cy="12" r="9"/><path d="M12 5.5V12l4 2"/><circle cx="12" cy="12" r="1.4" fill="#fff" stroke="none"/>',
      dashboard:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
      shield:'<path d="M12 2 21 6v6c0 5-4 8-9 10-5-2-9-5-9-10V6l9-4ZM8 12l3 3 5-5"/>',
      hash:'<path d="M5 9h14M5 15h14M9 4 7 20M17 4l-2 16"/>',
      package:'<path d="m12 2 9 5v10l-9 5-9-5V7l9-5ZM3 7l9 5 9-5M12 12v10"/>',
      wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/>',
      car:'<path d="M4 14h16l-1.5-5.5A2 2 0 0 0 16.6 7H7.4a2 2 0 0 0-1.9 1.5L4 14Z"/><path d="M6 17h.01M18 17h.01M5 14v3h14v-3"/>',
      building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-5h4v5"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 10h18c0-3-3-3-3-10M10 21h4"/>',
      chart:'<path d="M4 19V5M8 19v-8M12 19V8M16 19v-5M20 19V7"/>',
      gear:'<circle cx="12" cy="12" r="3"/><path d="M9 3h6l.7 2.5 1.5.7 2.4-1.1 2.4 4.3-2 1.6v2l2 1.6-2.4 4.3-2.4-1.1-1.5.7L15 21H9l-.7-2.5-1.5-.7-2.4 1.1L2 14.6 4 13v-2L2 9.4l2.4-4.3 2.4 1.1 1.5-.7L9 3Z"/>',
      plug:'<path d="M9 7v4M15 7v4M8 11h8v2a4 4 0 0 1-8 0v-2ZM12 17v4"/>',
      calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
      award:'<circle cx="12" cy="8" r="5"/><path d="M8.5 12.5 7 21l5-2 5 2-1.5-8.5"/>',
      bag:'<path d="M4 9h16l-1 12H5L4 9ZM9 10V7a3 3 0 0 1 6 0v3"/>',
      cart:'<circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H7"/>',
      search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',
      file:'<path d="M6 3h9l5 5v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM15 3v5h5"/>',
      alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
      edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
      ban:'<circle cx="12" cy="12" r="9"/><path d="m7 7 10 10"/>',
      layers:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 13l9 5 9-5M3 18l9 5 9-5"/>',
      chev:'<path d="m6 9 6 6 6-6"/>',
      copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
      download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
      flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
      power:'<path d="M12 2v10M7.5 5.5a7 7 0 1 0 9 0"/>',
      cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
      server:'<rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01"/>',
      mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/>',
      lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.3M21 3v6h-6"/>',
      arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    };
    const icon = (n, cls='') => `<svg aria-hidden="true" class="i ${cls}" viewBox="0 0 24 24">${I[n] || I.dashboard}</svg>`;
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const n = (v) => Number(v || 0).toLocaleString();
    const money = (v) => `₹${Number(v || 0).toLocaleString('en-IN')}`;
    const fmtDate = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    };
    const fmtDateTime = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '—';
      const date = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${date} ${time}`;
    };
    const periodLabel = () => ({ today:'Today', month:'This month', quarter:'This Qtr', year:'This Year', all:'Lifetime' }[state.period] || state.period);
    const statusTone = (status) => {
      const s = String(status || '').toLowerCase();
      if (s === 'certified' || s === 'approved' || s === 'completed' || s === 'active' || s === 'verified') return 'ok';
      if (s === 'submitted' || s === 'pending' || s === 'pending_rc') return 'blue';
      if (s === 'draft') return 'warn';
      if (s.includes('fail') || s === 'rejected' || s === 'expired' || s === 'inactive') return 'bad';
      return 'muted';
    };
    const statusBadge = (status) => {
      const cls = statusTone(status);
      return `<span class="sa-badge ${cls === 'muted' ? '' : cls}">${esc(status || '—')}</span>`;
    };
    const statusLabelText = (r) => {
      if (r.status_label) return r.status_label;
      const s = String(r.status || '').toLowerCase();
      if (s === 'certified' || s === 'approved') return 'Verified';
      return r.status || '—';
    };

    async function doLogout() {
      try { await api('/api/v1/auth/logout', { method: 'POST', token: authState.token }); } catch (_) {}
      clearAuth();
      renderLogin({ step: 'credentials' });
    }

    function toast(msg) {
      state.toast = msg;
      render(true);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { state.toast = null; render(true); }, 2400);
    }

    function onAuthFail(json, res) {
      if (json.error?.code === 'UNAUTHORIZED' || res.status === 401) {
        clearAuth();
        renderLogin({ step: 'credentials', error: 'Session expired. Please sign in again.' });
        return true;
      }
      return false;
    }

    async function loadDash(silent) {
      if (!silent) state.loading = true;
      const { res, json } = await api(`/api/v1/admin/dashboard?period=${encodeURIComponent(state.period)}`, { token: authState.token });
      if (!res.ok) {
        state.loading = false;
        state.error = json.error?.message || 'Could not load dashboard';
        if (onAuthFail(json, res)) return;
        render(true);
        return;
      }
      state.dash = json.data;
      state.loading = false;
      state.error = null;
      render(true);
    }

    function listPath() {
      const q = encodeURIComponent(state.q || '');
      const lim = state.list.limit || listLimitFor(state.page);
      const off = state.list.offset || 0;
      const pageNum = Math.floor(off / lim) + 1;
      if (state.page === 'Verification') {
        const st = encodeURIComponent(state.statusFilter || '');
        const ty = encodeURIComponent(state.typeFilter || '');
        const rc = encodeURIComponent(state.rcFilter || '');
        const period = encodeURIComponent(state.period || 'month');
        return `/api/v1/admin/verifications?limit=${lim}&offset=${off}&page=${pageNum}&q=${q}&status=${st}&type=${ty}&rcId=${rc}&rc=${rc}&period=${period}`;
      }
      if (state.page === 'Regional Centers') return `/api/v1/admin/regional-centers?q=${q}`;
      if (state.page === 'Products') return `/api/v1/admin/products?limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'VCT') return `/api/v1/admin/users?role=VCT&limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'Customers') return `/api/v1/admin/customers?limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'RC Quota') return `/api/v1/admin/quota?limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'RC Wallet') {
        const tab = encodeURIComponent(state.subTab || 'balances');
        return `/api/v1/admin/wallets?limit=${lim}&offset=${off}&q=${q}&view=${tab}&tab=${tab}`;
      }
      if (state.page === 'Vehicles') {
        const tab = encodeURIComponent(state.subTab || 'All');
        return `/api/v1/admin/vehicles?limit=${lim}&offset=${off}&q=${q}&tab=${tab}`;
      }
      return null;
    }

    function normalizeRcOptions(items) {
      return (items || [])
        .map((rc) => ({
          id: String(rc.id || ''),
          code: rc.code || '',
          name: rc.name || rc.company_name || rc.code || 'RC',
        }))
        .filter((rc) => rc.id)
        .sort((a, b) => String(a.name).localeCompare(String(b.name)));
    }

    async function loadRcOptions(silent) {
      if (state.rcOptions?.length) return;
      const fromDash = normalizeRcOptions(state.dash?.regionalCenters);
      if (fromDash.length) {
        state.rcOptions = fromDash;
        return;
      }
      const { res, json } = await api('/api/v1/admin/regional-centers', { token: authState.token });
      if (!res.ok) {
        if (!silent) state.listError = json.error?.message || 'Could not load regional centres';
        if (onAuthFail(json, res)) return;
        return;
      }
      state.rcOptions = normalizeRcOptions(json.data?.items);
    }

    async function loadList(silent) {
      const path = listPath();
      if (!path) return;
      if (!silent) state.listLoading = true;
      state.listError = null;
      render(true);
      const { res, json } = await api(path, { token: authState.token });
      if (!res.ok) {
        state.listLoading = false;
        state.listError = json.error?.message || 'Could not load list';
        if (onAuthFail(json, res)) return;
        render(true);
        return;
      }
      const data = json.data || {};
      state.list = {
        total: data.total || 0,
        items: data.items || [],
        limit: data.limit != null ? data.limit : (state.list.limit || listLimitFor(state.page)),
        offset: data.offset != null ? data.offset : (state.list.offset || 0),
        summary: data.summary || null,
      };
      state.listLoading = false;
      state.listError = null;
      render(true);
    }

    function goPage(page, opts = {}) {
      const prevPage = state.page;
      state.page = page;
      state.drawer = false;
      state.q = opts.q != null ? opts.q : '';
      state.statusFilter = opts.statusFilter != null ? opts.statusFilter : '';
      state.typeFilter = opts.typeFilter != null ? opts.typeFilter : '';
      // Keep RC filter when switching Verification tabs; clear when leaving the page.
      state.rcFilter = opts.rcFilter != null
        ? opts.rcFilter
        : (page === 'Verification' && prevPage === 'Verification' ? state.rcFilter : '');
      {
        const defaults = { 'RC Wallet': 'balances', Vehicles: 'All', Laboratory: 'menu' };
        const incoming = opts.tab != null ? String(opts.tab) : '';
        state.subTab = incoming || defaults[page] || '';
      }
      state.list = { total: 0, items: [], limit: listLimitFor(page), offset: 0, summary: null };
      state.listError = null;
      render();
      if (LIST_PAGES.has(page)) {
        if (page === 'Verification') {
          loadRcOptions(true).finally(() => loadList());
        } else {
          loadList();
        }
      }
      else if (page === 'Dashboard') loadDash(true);
      else if (page === 'Settings' || page === 'Integrations') {
        loadEmaapStatus(true);
        loadYesoneStatus(true);
        loadRazorpayStatus(true);
        loadZohoStatus(true);
      }
    }

    function isNavOn(m) {
      if (state.page !== m.id) return false;
      if (m.filter) {
        return state.typeFilter === (m.filter.typeFilter || '') &&
          state.statusFilter === (m.filter.statusFilter || '');
      }
      if (m.tab != null) {
        const defaults = { 'RC Wallet': 'balances', Vehicles: 'All', Laboratory: 'menu' };
        const current = state.subTab || defaults[m.id] || '';
        return current === m.tab;
      }
      return true;
    }

    function sidebar() {
      const uname = esc(authState.user.username || 'super_admin');
      const initials = uname.slice(0, 2).toUpperCase();
      const items = MENUS.map((m) => {
        const attrs = [`data-page="${esc(m.id)}"`];
        if (m.filter) {
          if (m.filter.typeFilter) attrs.push(`data-type-filter="${esc(m.filter.typeFilter)}"`);
          if (m.filter.statusFilter) attrs.push(`data-status-filter="${esc(m.filter.statusFilter)}"`);
        }
        if (m.tab) attrs.push(`data-tab="${esc(m.tab)}"`);
        return `<button type="button" class="sa-navbtn ${isNavOn(m)?'on':''}" ${attrs.join(' ')}>${icon(m.ico)}<span>${esc(m.label)}</span></button>`;
      }).join('');
      return `<div class="sa-overlay ${state.drawer ? 'on' : ''}" data-action="close-drawer"></div>
      <aside class="sa-side ${state.drawer ? 'open' : ''}">
        <div class="sa-side-top">
          <div class="sa-brand">
            <div class="sa-logo">${icon('shield')}</div>
            <div><b>GATC</b><small>Government Approved<br>Test Centre</small></div>
          </div>
        </div>
        <nav class="sa-nav">
          <div class="sa-cap">WORKSPACE</div>
          ${items}
        </nav>
        <div class="sa-foot">
          <div class="sa-user"><div class="sa-av">${initials}</div><div style="flex:1;min-width:0"><b style="font-size:12px">${uname}</b><span style="display:block;font-size:10px;color:#7b8799">Super Admin</span></div>
          <button type="button" class="sa-out" data-action="logout">Sign out</button></div>
        </div>
      </aside>`;
    }

    function topbar() {
      return `<header class="sa-top sa-top--minimal">
        <button type="button" class="sa-menu" data-action="open-drawer" aria-label="Menu">${icon('menu')}</button>
      </header>`;
    }

    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '—';
      return ((parts[0][0] || '') + (parts[1]?.[0] || parts[0][1] || '')).toUpperCase();
    }

    function avatarHtml(url, name) {
      const ini = esc(initialsOf(name));
      if (url) {
        return `<span class="sa-avimg"><img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove();this.parentNode.textContent='${ini}'"/></span>`;
      }
      return `<span class="sa-avimg">${ini}</span>`;
    }

    function heading(title, sub, extraRight = '') {
      const d = new Date().toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
      return `<div class="sa-h-row"><div><div class="eye">SUPER ADMIN</div><h1 style="margin:0;font-family:Outfit,system-ui,sans-serif;font-size:1.7rem;letter-spacing:-.04em">${esc(title)}</h1><p style="margin:4px 0 0;color:var(--muted);font-size:13px">${esc(sub)}</p></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${extraRight}<div class="sa-date">${icon('calendar')}<span>${esc(d)}</span></div></div></div>`;
    }

    function periodButtons() {
      const opts = [['today','Today'],['month','This month'],['quarter','This Qtr'],['year','This Year'],['all','Lifetime']];
      return `<div class="sa-periods" role="group" aria-label="Period">${opts.map(([k,l]) => `<button type="button" class="${state.period===k?'on':''}" data-period="${k}">${l}</button>`).join('')}</div>`;
    }

    function dashboard() {
      const d = state.dash || {};
      const byType = d.byType || { OV: 0, RV: 0 };
      const st = d.byStatus || {};
      const cert = d.certified || {};
      const totals = d.totals || {};
      const rcs = d.regionalCenters || [];
      const vcts = (d.topVcts || []).filter((v) => Number(v.certified) > 0);
      const periodCount = (byType.OV || 0) + (byType.RV || 0);
      const stages = [
        ['submitted', 'Submitted', 'blue', 'file'],
        ['failed_submit', 'Failed', 'red', 'alert'],
        ['draft', 'Draft', 'violet', 'edit'],
        ['certified', 'Certified', 'green', 'award'],
        ['rejected', 'Rejected', 'gray', 'ban'],
      ];
      if (state.loading && !state.dash) {
        return `${heading('Dashboard', 'Verification overview', periodButtons())}<p class="ui-note">Loading dashboard…</p>`;
      }
      if (state.error && !state.dash) {
        return `${heading('Dashboard', 'Verification overview', periodButtons())}<p class="auth-error" role="alert">${esc(state.error)}</p>
          <button class="btn primary" data-action="refresh">Retry</button>`;
      }
      return `${heading('Dashboard', 'Verification overview', periodButtons())}
        <section class="sa-hero" aria-label="Verification types">
          <button type="button" class="sa-type ov" data-page="Verification" data-type-filter="OV"><span class="top"><span class="badge">OV</span>${icon('layers')}</span><span class="num">${n(byType.OV)}</span><span class="tiny">Original verification</span></button>
          <button type="button" class="sa-type rv" data-page="Verification" data-type-filter="RV"><span class="top"><span class="badge">RV</span>${icon('shield')}</span><span class="num">${n(byType.RV)}</span><span class="tiny">Re-verification</span></button>
          <div class="sa-scope">
            <span class="lbl">Period scope</span>
            <span class="val">${esc(periodLabel())}</span>
            <span class="sub">${n(periodCount)} verifications</span>
          </div>
        </section>
        <div class="sa-stage-grid" aria-label="Verification stages">
          ${stages.map(([key,label,tone,ico]) => {
            const count = st[key] || (key==='certified' ? (st.certified || cert.lifetime || 0) : 0);
            return `<div class="sa-stage-card ${tone}"><div class="row"><span class="lbl">${esc(label)}</span><span class="sa-stage-ico ${tone}">${icon(ico,'sm')}</span></div><span class="cnt">${n(count)}</span></div>`;
          }).join('')}
        </div>
        <section class="sa-mid" aria-label="Certified totals">
          <div class="sa-q orange"><span class="ico">${icon('chart')}</span><div><b>Total Certified</b><strong>${n(cert.last_month)}</strong><small>Last month</small></div></div>
          <div class="sa-q green"><span class="ico">${icon('award')}</span><div><b>Total Certified</b><strong>${n(cert.this_month)}</strong><small>This month</small></div></div>
        </section>
        <div class="sa-stats">
          <button type="button" class="sa-stat sa-stat-btn" data-page="Regional Centers"><span>Regional Centers</span><b>${n(totals.regional_centers)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="VCT"><span>VCT</span><b>${n(totals.vct)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="Products"><span>Products</span><b>${n(totals.products)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="Customers"><span>Customers</span><b>${n(totals.customers)}</b></button>
        </div>
        <div class="sa-lists">
          <section class="sa-panel">
            <div class="sa-panel-h"><h2>Regional Centers</h2><button type="button" class="sa-link" data-page="Regional Centers">View All →</button></div>
            ${rcs.length ? `<ul class="sa-rc">${rcs.map((rc,i)=>`<li><span class="rank">#${i+1}</span>${avatarHtml(rc.logoUrl, rc.name || rc.code)}<div class="body"><b>${esc(rc.name || rc.code || 'RC')}</b><span>${esc(rc.code || rc.district || '—')}</span></div><span class="cnt">${n(rc.certified)}</span></li>`).join('')}</ul>` : `<p class="ui-note">No regional centers yet.</p>`}
          </section>
          <section class="sa-panel">
            <div class="sa-panel-h"><h2>VCT</h2><button type="button" class="sa-link" data-page="VCT">View All →</button></div>
            ${vcts.length ? `<ul class="sa-vct">${vcts.map((v,i)=>`<li><span class="rank">#${i+1}</span>${avatarHtml(v.photoUrl, v.name)}<div class="body"><b>${esc(v.name || 'VCT')}</b><span>${esc(v.rc_name || v.rc_code || '—')}</span></div><span class="cnt">${n(v.certified)}</span></li>`).join('')}</ul>` : `<p class="ui-note">No VCT performance yet.</p>`}
          </section>
        </div>`;
    }

    function listTools(extra = '') {
      return `<div class="sa-tools">
        <label class="sa-search">${icon('search','sm')}<input id="sa-q" type="search" placeholder="Search…" value="${esc(state.q)}" aria-label="Search"/></label>
        ${extra}
        <button type="button" class="sa-btn" data-action="list-search">Search</button>
        <button type="button" class="sa-btn ghost" data-action="list-reset">Reset</button>
      </div>`;
    }

    function pager(placement = '') {
      const { total, limit, offset } = state.list;
      const from = total ? offset + 1 : 0;
      const to = Math.min(offset + limit, total);
      const canPrev = offset > 0;
      const canNext = offset + limit < total;
      const cls = placement === 'top' ? 'sa-pager top' : 'sa-pager';
      return `<div class="${cls}" role="navigation" aria-label="${placement === 'top' ? 'List pagination top' : 'List pagination'}">
        <span>Showing ${n(from)}–${n(to)} of ${n(total)}</span>
        <div style="display:flex;gap:8px">
          <button type="button" class="sa-btn ghost" data-action="list-prev" ${canPrev?'':'disabled'}>Previous</button>
          <button type="button" class="sa-btn ghost" data-action="list-next" ${canNext?'':'disabled'}>Next</button>

    function verificationCard(r) {
      const type = String(r.verification_type || '').toUpperCase();
      const tone = statusTone(r.status_label || r.status);
      const label = statusLabelText(r);
      const ref = r.reference || r.certificate_number || r.application_number || '—';
      const when = fmtDateTime(r.certified_at || r.submitted_at || r.created_at);
      const thumb = `${icon('layers')}${r.product_image_url
        ? `<img src="${esc(r.product_image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>`
        : ''}`;
      const dlUrl = r.download_url || r.signed_pdf_url || r.certificate_pdf_url || '';
      const viewUrl = r.signed_pdf_url || r.download_url || r.certificate_pdf_url || '';
      const pdfFileBase = String(ref || '').trim();
      const pdfFileName = pdfFileBase && pdfFileBase !== '—'
        ? `${pdfFileBase.replace(/\.pdf$/i, '').replace(/[\\/]+/g, '-').replace(/[^\w.\-]+/g, '_')}.pdf`
        : 'certificate.pdf';
      const pdfBadge = viewUrl
        ? `<a class="sa-vcard-pdf" href="${esc(viewUrl)}" data-action="open-pdf" data-url="${esc(viewUrl)}" data-disposition="inline" data-filename="${esc(pdfFileName)}" title="Open certificate PDF">${r.has_signed_pdf || r.signed_pdf_url ? 'Signed PDF' : 'PDF'}</a>`
        : '';
      const rc = r.rc_name || r.rc_code || '';
      const canDl = Boolean(dlUrl);
      const dlHref = dlUrl.startsWith('/api/')
        ? `${esc(dlUrl)}${dlUrl.includes('?') ? '&' : '?'}disposition=attachment`
        : esc(dlUrl);
      const pdfIco = `<svg class="sa-pdf-ico" viewBox="0 0 22 26" aria-hidden="true" focusable="false"><rect x="1" y="1" width="20" height="24" rx="2.5" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><path d="M1 1h14l6 6v3H1V1Z" fill="#dc2626"/><path d="M15 1v6h6" fill="#fecaca"/><text x="11" y="19" text-anchor="middle" font-size="7.5" font-weight="800" font-family="Outfit,system-ui,sans-serif" fill="#dc2626">PDF</text></svg>`;
      const dlBtn = canDl
        ? `<a class="sa-vcard-dl" href="${dlHref}" data-action="open-pdf" data-url="${esc(dlUrl)}" data-disposition="attachment" data-filename="${esc(pdfFileName)}" title="Download ${esc(pdfFileName)}" aria-label="Download ${esc(pdfFileName)}">${pdfIco}<span>Download</span></a>`
        : `<button type="button" class="sa-vcard-dl" disabled aria-disabled="true" title="No PDF available">${pdfIco}<span>No PDF</span></button>`;
      return `<article class="sa-vcard">
        <div class="sa-vcard-left">
          <div class="sa-vcard-thumb">${thumb}</div>
          <div class="sa-vcard-status ${tone}">${esc(label)}</div>
        </div>
        <div class="sa-vcard-main">
          <div class="sa-vcard-head">
            <h3 class="sa-vcard-name">${esc(r.customer_name || '—')}</h3>
          </div>
          <div class="sa-vcard-meta">
            <span class="sa-vcard-ref">${esc(ref)}</span>
            ${pdfBadge}
            ${rc ? `<span class="sa-vcard-divider" aria-hidden="true"></span><span class="sa-vcard-rc">${esc(rc)}</span>` : ''}
          </div>
          <div class="sa-vcard-specs">
            <div class="sa-vcard-spec"><span>Max</span><b title="${esc(r.max_display || '')}">${esc(r.max_display || '—')}</b></div>
            <div class="sa-vcard-spec"><span>Min</span><b title="${esc(r.min_display || '')}">${esc(r.min_display || '—')}</b></div>
            <div class="sa-vcard-spec"><span>Class</span><b>${esc(r.accuracy_class || '—')}</b></div>
            <div class="sa-vcard-spec"><span>Serial no.</span><b class="mono" title="${esc(r.serial_number || '')}">${esc(r.serial_number || '—')}</b></div>
            <div class="sa-vcard-spec"><span>Date</span><b title="${esc(when)}">${esc(when)}</b></div>
            <div class="sa-vcard-spec"><span>VCT</span><b title="${esc(r.vct_name || '')}">${esc(r.vct_name || '—')}</b></div>
          </div>
        </div>
        <div class="sa-vcard-action"><span class="sa-vcard-type ${type === 'RV' ? 'rv' : ''}" title="${esc(type || '—')}">${esc(type || '—')}</span>${dlBtn}</div>
      </article>`;
    }

    function formatYesoneSyncWhen(iso) {
      if (!iso) return 'Never';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString();
      } catch {
        return String(iso);
      }
    }

    function yesoneSyncSummary(sync) {
      if (!sync) return 'No sync runs yet.';
      if (sync.running) return 'Sync in progress…';
      if (sync.lastError) return `Error: ${sync.lastError}`;
      const run = sync.lastRun;
      if (!run) return sync.lastSuccessAt ? `Last success ${formatYesoneSyncWhen(sync.lastSuccessAt)}` : 'No sync runs yet.';
      const u = run.upserted || {};
      const parts = [];
      const vi = (u.verificationsInserted || 0) + (u.verificationsUpdated || 0);
      if (vi) parts.push(`${vi} verification${vi === 1 ? '' : 's'}`);
      const ui = (u.usersInserted || 0) + (u.usersUpdated || 0);
      if (ui) parts.push(`${ui} user${ui === 1 ? '' : 's'}`);
      const rc = u.regionalCenters || 0;
      if (rc) parts.push(`${rc} RC`);
      const pdf = run.pdfDownloaded || 0;
      if (pdf) parts.push(`${pdf} PDF`);
      const tail = parts.length ? parts.join(', ') : 'no changes';
      return `Last success ${formatYesoneSyncWhen(sync.lastSuccessAt)} · ${tail}`;
    }

    function loadRazorpayCheckoutScript() {
      return new Promise((resolve, reject) => {
        if (window.Razorpay) {
          resolve(window.Razorpay);
          return;
        }
        const existing = document.querySelector('script[data-gatc-razorpay-checkout]');
        if (existing) {
          existing.addEventListener('load', () => resolve(window.Razorpay));
          existing.addEventListener('error', () => reject(new Error('Could not load Razorpay Checkout')));
          return;
        }
        const s = document.createElement('script');
        s.src = 'https://checkout.razorpay.com/v1/checkout.js';
        s.async = true;
        s.dataset.gatcRazorpayCheckout = '1';
        s.onload = () => resolve(window.Razorpay);
        s.onerror = () => reject(new Error('Could not load Razorpay Checkout'));
        document.head.appendChild(s);

    async function runRazorpayTestPayment() {
      if (state.razorpayTest?.busy) return;
      if (!state.razorpay?.configured) {
        toast('Connect Razorpay before running a test payment');
        return;
      }
      const amountRaw = (root.querySelector('#razorpay-test-amount')?.value || '1').trim();
      const amountInr = Number(amountRaw);
      if (!Number.isFinite(amountInr) || amountInr < 1) {
        toast('Enter a valid amount in INR (minimum ₹1)');
        return;
      }
      const receipt = (root.querySelector('#razorpay-test-receipt')?.value || '').trim();
      const note = (root.querySelector('#razorpay-test-note')?.value || '').trim();
      const liveWarn = 'This uses LIVE Razorpay keys and will charge REAL money. Continue with ₹'
        + amountInr.toFixed(2) + '?';
      if (!window.confirm(liveWarn)) return;

      state.razorpayTest = { busy: true, lastResult: null };
      render(true);
      try {
        const { res, json } = await api('/api/v1/admin/integrations/razorpay/test-order', {
          method: 'POST',
          token: authState.token,
          body: { amountInr, receipt: receipt || undefined, note: note || undefined },
        });
        if (!res.ok) {
          if (onAuthFail(json, res)) return;
          state.razorpayTest = { busy: false, lastResult: { ok: false, message: json.error?.message || 'Order failed' } };
          toast(json.error?.message || 'Could not create test order');
          render(true);
          return;
        }
        const order = json.data || {};
        const RazorpayCtor = await loadRazorpayCheckoutScript();
        await new Promise((resolve) => {
          const rzp = new RazorpayCtor({
            key: order.keyId,
            amount: order.amount,
            currency: order.currency || 'INR',
            name: 'GATC test payment',
            description: note || 'Admin Razorpay connectivity test',
            order_id: order.orderId,
            theme: { color: '#2563eb' },
            handler: async (response) => {
              try {
                const verify = await api('/api/v1/admin/integrations/razorpay/verify-payment', {
                  method: 'POST',
                  token: authState.token,
                  body: {
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature,
                  },
                });
                if (!verify.res.ok || !verify.json?.data?.verified) {
                  const httpHint = !verify.res.ok
                    ? `Verify request failed (HTTP ${verify.res.status})`
                    : 'Signature verification failed';
                  state.razorpayTest = {
                    busy: false,
                    lastResult: {
                      ok: false,
                      message: verify.json?.error?.message || httpHint,
                      paymentId: response.razorpay_payment_id || null,
                    },
                  };
                  toast(state.razorpayTest.lastResult.message);
                } else {
                  state.razorpayTest = {
                    busy: false,
                    lastResult: {
                      ok: true,
                      message: 'Payment verified',
                      paymentId: verify.json.data.paymentId,
                      orderId: verify.json.data.orderId,
                      amountInr: order.amountInr,
                    },
                  };
                  toast('Test payment success — signature verified');
                }
              } catch (err) {
                state.razorpayTest = {
                  busy: false,
                  lastResult: { ok: false, message: err.message || 'Verify failed' },
                };
                toast(state.razorpayTest.lastResult.message);
              }
              render(true);
              resolve();
            },
            modal: {
              ondismiss: () => {
                state.razorpayTest = {
                  busy: false,
                  lastResult: { ok: false, message: 'Checkout closed without payment' },
                };
                render(true);
                resolve();
              },
            },
          });
          rzp.on('payment.failed', (resp) => {
            const desc = resp?.error?.description || resp?.error?.reason || 'Payment failed';
            state.razorpayTest = {
              busy: false,
              lastResult: { ok: false, message: desc },
            };
            toast(desc);
            render(true);
            resolve();
          });
          rzp.open();
        });
      } catch (err) {
        state.razorpayTest = {
          busy: false,
          lastResult: { ok: false, message: err.message || 'Test payment failed' },
        };
        toast(state.razorpayTest.lastResult.message);
        render(true);
      }
    }

    async function startZohoOAuthPopup() {
      if (state.zohoBusy) return;
      state.zohoBusy = true;
      render(true);
      const { res, json } = await api('/api/v1/admin/integrations/zoho/oauth/start', { token: authState.token });
      state.zohoBusy = false;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        toast(json.error?.message || 'Could not start Zoho sign-in');
        render(true);
        return;
      }
      const url = json.data?.authorizeUrl;
      if (!url) {
        toast('Zoho authorize URL missing');
        render(true);
        return;
      }
      // Zoho accounts pages set CSP/X-Frame-Options that block iframes — use centered OAuth popup.
      const w = 520;
      const h = 720;
      const left = Math.max(0, Math.round((window.screen.width - w) / 2));
      const top = Math.max(0, Math.round((window.screen.height - h) / 2));
      const popup = window.open(
        url,
        'gatc-zoho-oauth',
        `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`,
      );
      if (!popup) {
        toast('Popup blocked — allow popups for this site, then try again');
        render(true);
        return;
      }
      toast('Complete Zoho Sign-in in the popup…');
      render(true);
      const started = Date.now();
      const poll = setInterval(() => {
        if (popup.closed || Date.now() - started > 12 * 60 * 1000) {
          clearInterval(poll);
          loadZohoStatus(true);
        }
      }, 900);
    }

    function filenameFromContentDisposition(header) {
      if (!header) return '';
      const star = /filename\*\s*=\s*(?:UTF-8''|utf-8'')([^;]+)/i.exec(header);
      if (star?.[1]) {
        try {
          return decodeURIComponent(star[1].trim().replace(/^"|"$/g, ''));
        } catch (_) { /* ignore */ }
      }
      const plain = /filename\s*=\s*"((?:\\.|[^"\\])*)"|filename\s*=\s*([^;]+)/i.exec(header);
      const raw = (plain?.[1] || plain?.[2] || '').trim().replace(/^"|"$/g, '');
      return raw;
    }

    function safePdfDownloadName(name, fallback = 'certificate.pdf') {
      const raw = String(name || '').trim() || fallback;
      let base = raw.replace(/\.pdf$/i, '').replace(/[\\/]+/g, '-').replace(/[^\w.\-]+/g, '_');
      if (!base) base = 'certificate';
      return `${base}.pdf`;
    }

    async function openCertificatePdf(url, disposition = 'inline', preferredName = '') {
      if (!url) return;
      let target = url;
      if (target.startsWith('/api/') && disposition === 'attachment') {
        target += (target.includes('?') ? '&' : '?') + 'disposition=attachment';
      }
      if (target.startsWith('/api/')) {
        toast(disposition === 'attachment' ? 'Downloading PDF…' : 'Opening PDF…');
        try {
          const res = await fetch(API_BASE + target, {
            headers: { authorization: `Bearer ${authState.token}` },
          });
          if (!res.ok) {
            toast('PDF unavailable');
            return;
          }
          const headerName = filenameFromContentDisposition(res.headers.get('content-disposition'));
          const fileName = safePdfDownloadName(headerName || preferredName || 'certificate.pdf');
          const blob = await res.blob();
          const obj = URL.createObjectURL(blob);
          if (disposition === 'attachment') {
            const a = document.createElement('a');
            a.href = obj;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(obj), 60_000);
          } else {
            window.open(obj, '_blank', 'noopener');
            setTimeout(() => URL.revokeObjectURL(obj), 120_000);
          }
        } catch (_) {
          toast('PDF download failed');
        }
        return;
      }
      window.open(target, '_blank', 'noopener,noreferrer');
    }

    root.onclick = (e) => {
      // Backdrop click (dimmed overlay only — not dialog internals).

        closeIntegrationModal();
        return;
      }
      const btn = e.target.closest('button,[data-page],[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'open-pdf') {
        e.preventDefault();
        openCertificatePdf(
          btn.dataset.url || btn.getAttribute('href'),
          btn.dataset.disposition || 'inline',
          btn.dataset.filename || '',
        );
        return;
      }
      if (btn.dataset.page) {
        goPage(btn.dataset.page, {
          typeFilter: btn.dataset.typeFilter || '',

          state.list.offset = 0;
          loadList();
        } else {
          loadDash();
        }
        return;
      }
      const action = btn.dataset.action;
      if (action === 'open-drawer') { state.drawer = true; render(true); }

      else if (action === 'configure-integration') {

          loadEmaapStatus(true);
          loadEmaapApis(true);

        else toast(base);
      }
      else if (action === 'close-integration-modal') {
        e.preventDefault();
        e.stopPropagation();
        closeIntegrationModal();
      }
      else if (action === 'save-emaap-credentials') {
        saveEmaapCredentialsFromForm();
      }
      else if (action === 'save-yesone-credentials') {
        saveYesoneCredentialsFromForm();
      }
      else if (action === 'yesone-sync-now') {
        runYesoneSyncNow();
      }
      else if (action === 'save-razorpay-credentials') {
        saveRazorpayCredentialsFromForm();
      }
      else if (action === 'razorpay-test-pay') {

        'https://ecs.benchpc.online',

      if (!allowedOrigins.has(ev.origin)) return;

  function sidebar(){const uname=escapeHtml(authState.user.username||authState.user.aadhaar||'RC Admin');const role=escapeHtml(authState.user.role||'RC_ADMIN');const initials=(authState.user.username||'RC').slice(0,2).toUpperCase();return `<div class="drawer-overlay ${state.drawer?'visible':''}" data-action="close-drawer"></div><aside class="sidebar ${state.drawer?'open':''}" aria-label="Primary navigation"><div class="sidebar-top"><div class="logo-row"><div class="logo-mark">${icon('scale','lg')}</div><div><div class="logo-title">GATC<em>.</em></div><div class="logo-note">VERIFICATION SYSTEM</div></div></div><div class="workspace"><span class="workspace-icon">${icon('building')}</span><div class="workspace-text"><b>RC Workspace</b><span>Regional Centre Admin</span></div>${icon('down','sm')}</div></div><nav class="sidebar-body"><div class="nav-caption">WORKSPACE</div>${listnav(nav)}<div class="nav-caption" style="margin-top:15px">MANAGEMENT</div><button class="nav-btn" data-action="toggle-settings">${icon('gear')}<span class="nav-label">Settings</span>${icon('down','sm')}</button>${state.settings?`<div class="subnav">${listnav(subnav)}</div>`:''}</nav><div class="sidebar-bottom">${listnav([{label:'Profile',ico:'profile'}])}<div class="account-foot"><div class="avatar">${escapeHtml(initials)}</div><div style="flex:1;min-width:0"><b>${uname}</b><small>${role}</small></div><button type="button" class="logout-btn" data-action="logout" title="Sign out">Sign out</button></div></div></aside>`;}
  function header(){return `<div class="mobile-status"><span>9:41</span><span>●●● &nbsp;◕ &nbsp;▰</span></div><header class="topbar"><button class="iconbtn menu-toggle" type="button" aria-label="Open left menu" data-action="open-drawer">${icon('menu')}</button><div class="crumb">GATC / <strong>${esc(state.page)}</strong></div><div class="mobile-brand"><b>GATC<em>.</em></b><small>RC ADMIN WORKSPACE</small></div><div class="top-spacer"></div><div class="top-right"><span class="online-pill"><span class="online-dot"></span> UI Preview</span><button type="button" class="iconbtn" aria-label="Notifications" data-action="notifications">${icon('bell','sm')}<span class="notify-dot"></span></button><button type="button" class="avatar" aria-label="Open profile" data-page="Profile">RC</button></div></header>`;}
  function statData(){const drafts=state.records.filter(r=>r.status==='Draft');const initial=state.period==='today'?{ov:3,rv:8,done:9,pending:2}:{ov:28,rv:72,done:88,pending:12};return {ov:initial.ov+drafts.filter(r=>r.type==='OV').length,rv:initial.rv+drafts.filter(r=>r.type==='RV').length,total:initial.ov+initial.rv+drafts.length,done:initial.done,pending:initial.pending+drafts.length};}
  function metrics(){const s=statData();const vals=[{name:'Total Verifications',num:s.total,ico:'verification',sub:'All verification requests'},{name:'Completed',num:s.done,ico:'check',sub:'Successfully completed',cls:'good'},{name:'Original (OV)',num:s.ov,ico:'file',sub:'Initial verifications'},{name:'Re-verify (RV)',num:s.rv,ico:'refresh',sub:'Periodic verifications'}];if(!isMobile){vals[1]={name:'Original (OV)',num:s.ov,ico:'file',sub:'Initial verification'};vals[2]={name:'Re-verification (RV)',num:s.rv,ico:'refresh',sub:'Periodic verification'};vals[3]={name:'Pending Actions',num:s.pending,ico:'clock',sub:'Requires your attention',cls:'warn'};}return `<div class="metrics">${vals.map(x=>`<article class="metric"><div class="metric-title-row"><span class="metric-title">${x.name}</span><span class="metric-icon ${x.cls||''}">${icon(x.ico,'sm')}</span></div><div class="metric-number">${x.num}</div><div class="metric-sub">${x.sub}</div></article>`).join('')}</div>`;}
  function hero(){return `<section class="hero"><div class="hero-text"><div class="hero-label">GATC VERIFICATION CENTRE</div><h2>${isMobile?'Start a verification':'Everything in one place.'}</h2><p>${isMobile?'New instrument or periodic verification.':'Manage instruments, pending work and certificates with ease.'}</p></div><div class="hero-actions"><button class="btn ${isMobile?'primary':'primary'}" data-action="new-ov">${icon('plus','sm')} New OV</button><button class="btn white" data-action="new-rv">${icon('refresh','sm')} New RV</button></div></section>`;}
  function attention(){return `<section class="panel"><div class="panel-head"><div><h3>Needs attention</h3><p>${isMobile?'':'Outstanding tasks and documents'}</p></div><span class="status pending">12 Open</span></div><div class="attention-row"><span class="attention-ico">${icon('clock')}</span><div class="attention-meta"><b>Pending submissions</b><small>Awaiting government processing</small></div><strong class="attention-value">7</strong></div><div class="attention-row"><span class="attention-ico blue">${icon('file')}</span><div class="attention-meta"><b>Signed PDFs pending</b><small>Certificates to upload</small></div><strong class="attention-value">5</strong></div></section>`;}
  function quick(){return `<section class="panel quick-panel"><div class="panel-head"><div><h3>Quick access</h3><p>Frequently used modules</p></div></div>${[{label:'Manage customers',page:'Customer',ico:'people'},{label:'Product master',page:'Product',ico:'package'},{label:'Manage VCT',page:'VCT',ico:'people'}].map(q=>`<button class="quick-link" data-page="${q.page}">${icon(q.ico)}<span>${q.label}</span>${icon('right','sm')}</button>`).join('')}</section>`;}
  function filteredRecords(){return state.records.filter(r=>(state.filter==='All'||r.type===state.filter)&&[r.id,r.customer,r.type,r.product,r.status].join(' ').toLowerCase().includes(state.search.toLowerCase())).slice(0,state.page==='Dashboard'?5:100);}
  function rows(){const items=filteredRecords();return {table:items.length?items.map(r=>`<tr data-record="${esc(r.id)}" tabindex="0" role="button" aria-label="View ${esc(r.id)}"><td><span class="record-customer">${esc(r.customer)}</span><span class="record-sub">${esc(r.product)}</span></td><td><span class="record-id">${esc(r.id)}</span></td><td>${esc(r.type)}</td><td><span class="status ${r.status==='Completed'?'completed':r.status==='Pending'?'pending':r.status==='Draft'?'draft':'pdf'}">${esc(r.status)}</span></td><td>${esc(r.date)}</td></tr>`).join(''):`<tr><td class="empty" colspan="5">No matching records</td></tr>`,cards:items.length?items.map(r=>`<button class="record-card" data-record="${esc(r.id)}"><span class="record-ico">${icon('verification')}</span><span class="record-main"><b>${esc(r.customer)}</b><small>${esc(r.id)} · ${esc(r.type)} · ${esc(r.product)}</small></span><span class="record-end"><span class="status ${r.status==='Completed'?'completed':r.status==='Pending'?'pending':r.status==='Draft'?'draft':'pdf'}">${esc(r.status)}</span><small>${esc(r.date)}</small></span></button>`).join(''):`<div class="empty">No matching verifications</div>`};}
  function recordsPanel(){const r=rows();return `<section class="panel record-panel"><div class="panel-head"><div><h3>${state.page==='Dashboard'?'Recent verifications':'Verification records'}</h3><p>Latest original and re-verification activities</p></div>${state.page==='Dashboard'?`<button class="linkbtn" data-page="Verification">View all →</button>`:''}</div><div class="record-tools"><label class="searchbox">${icon('search','sm')}<input id="search-records" placeholder="Search verification..." aria-label="Search verification records" value="${esc(state.search)}"/></label><div class="segmented">${['All','OV','RV'].map(f=>`<button class="segment ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div></div><table class="record-table"><thead><tr><th>CUSTOMER / INSTRUMENT</th><th>REFERENCE</th><th>TYPE</th><th>STATUS</th><th>DATE</th></tr></thead><tbody id="record-table-body">${r.table}</tbody></table><div class="mobile-records" id="mobile-records">${r.cards}</div><div class="panel-foot"><button class="linkbtn" data-page="Verification">View verification history ${icon('arrow','sm')}</button></div></section>`;}
  function dashboard(){return `${heading('Dashboard','RC ADMIN WORKSPACE','Verification overview and recent activity')}${hero()}<div class="section-row"><h3>Verification summary</h3><div class="segmented">${[['today','Today'],['month','This month']].map(([a,b])=>`<button class="segment ${state.period===a?'active':''}" data-period="${a}">${b}</button>`).join('')}</div></div>${metrics()}<div class="dashboard-grid">${recordsPanel()}<div class="side-column">${attention()}${quick()}</div></div><p class="ui-note">${icon('shield','sm')} Interactive reference only · Sample data · No connection to VPS or government portal</p>`;}
  function heading(title,eyebrow='RC WORKSPACE',desc=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1>${desc?`<p class="page-description">${esc(desc)}</p>`:''}</div><div class="date-chip">${icon('calendar','sm')}<span>31 October 2026</span>${isMobile?'31 Oct':''}</div></div>`;}
  const moduleConfig={
    Customer:{summary:'Customer directory and verification history',ico:'people',rows:[['Customer directory','View and search customers'],['Add customer','Create a customer record'],['Customer history','Related OV, RV and certificates']]},
    Product:{summary:'Instrument and product master',ico:'package',rows:[['Product catalogue','Instrument types, capacities and models'],['Add product','Create a product master entry'],['Product categories','Manage classifications']]},
    VCT:{summary:'Manage VCT members within your RC',ico:'people',rows:[['VCT directory','View VCT users'],['Create VCT','Add a VCT account'],['Assigned verifications','Review assigned work']]},
    Vehicle:{summary:'Vehicles associated with the RC',ico:'truck',rows:[['Vehicle directory','View registered vehicles'],['Add vehicle','Create vehicle record']]},
    Laboratory:{summary:'Laboratory details and equipment',ico:'flask',rows:[['Laboratory profile','Centre profile and facilities'],['Equipment register','Review laboratory equipment']]},
    Profile:{summary:'RC Administrator profile',ico:'profile',rows:[['Account details','Account and contact information'],['Security','Password and session settings'],['RC information','Regional Centre profile']]}
  };
  function modulePage(){if(state.page==='Verification')return `${heading('Verification','RC ADMIN WORKSPACE','Original and re-verification requests')}${hero()}${recordsPanel()}<p class="ui-note">${icon('shield','sm')} UI prototype only. Request submission is not enabled.</p>`;const m=moduleConfig[state.page]||moduleConfig.Customer;return `${heading(state.page,'RC ADMIN WORKSPACE',m.summary)}<section class="panel module-panel"><div class="module-icon">${icon(m.ico,'lg')}</div><h2 class="module-title">${esc(state.page)} management</h2><p class="module-summary">${esc(m.summary)}. Fields and workflows will be verified against the existing yesgatc project.</p><div class="module-list">${m.rows.map((r,i)=>`<button class="module-item" data-action="module-item" data-item="${i}">${icon(m.ico)}<span><b>${esc(r[0])}</b><small>${esc(r[1])}</small></span>${icon('right','sm')}</button>`).join('')}</div></section><p class="ui-note">${icon('shield','sm')} Reference UI only. No live records are changed.</p>`;}
  function modal(){const m=state.modal;if(!m)return '';if(m.type==='record'){const r=state.records.find(x=>x.id===m.id);if(!r)return '';return `<div class="modal-layer" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Verification details"><div class="modal-title-row"><h2>Verification details</h2><button class="close-btn" data-action="close-modal" aria-label="Close">${icon('close')}</button></div>${[['Reference',r.id],['Customer',r.customer],['Type',r.type],['Instrument',r.product],['Status',r.status],['Date',r.date]].map(([a,b])=>`<div class="detail-line"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<p class="form-note">This is sample data. Documents and government acknowledgements are not connected.</p><div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div></div></div>`;}const type=m.verificationType;return `<div class="modal-layer" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-title-row"><h2 id="modal-title">New ${type==='OV'?'Original Verification':'Re-Verification'}</h2><button class="close-btn" data-action="close-modal" aria-label="Close">${icon('close')}</button></div><form id="draft-form"><label class="field-label" for="customer">Customer name</label><input class="text-field" id="customer" name="customer" maxlength="100" placeholder="Enter customer name" required/><label class="field-label" for="product">Instrument / product</label><input class="text-field" id="product" name="product" maxlength="100" placeholder="e.g. Electronic weighing scale" required/><label class="field-label" for="serial">Serial number</label><input class="text-field" id="serial" name="serial" maxlength="80" placeholder="Enter instrument serial" required/><p class="form-note">Quick UI demonstration. Saves a draft in browser memory only, without uploading anything.</p><div class="modal-actions"><button type="button" class="btn outline" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save demo draft ${icon('arrow','sm')}</button></div></form></div></div>`;}
  function render(preserveScroll=false){const scrollTop=preserveScroll?(root.querySelector('.scroll')?.scrollTop||0):0;root.innerHTML=`<div class="app">${sidebar()}<div class="main">${header()}<div class="scroll"><div class="content">${state.page==='Dashboard'?dashboard():modulePage()}</div></div>${isMobile?`<div class="bottom-bar"><span>${icon('shield','sm')} Sample UI only</span><button data-action="new-ov">+ New verification</button></div>`:''}</div>${modal()}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}</div>`;if(preserveScroll){const scroll=root.querySelector('.scroll');if(scroll)scroll.scrollTop=scrollTop;}if(state.modal?.type==='new')root.querySelector('#customer')?.focus();}
  function toast(message){state.toast=message;render(true);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;render(true)},2700)}
  root.addEventListener('click',e=>{
    const btn=e.target.closest('button,[data-record],[data-backdrop]');if(!btn)return;
    if(btn.dataset.backdrop==='1'&&e.target===btn){state.modal=null;render(true);return;}
    if(btn.dataset.page){state.page=btn.dataset.page;state.drawer=false;state.filter='All';state.search='';render();return;}
    if(btn.dataset.period){state.period=btn.dataset.period;render(true);return;}
    if(btn.dataset.filter){state.filter=btn.dataset.filter;render(true);return;}
    if(btn.dataset.record){state.modal={type:'record',id:btn.dataset.record};render(true);return;}
    const action=btn.dataset.action;
    if(action==='open-drawer'){state.drawer=true;render(true)}
    else if(action==='close-drawer'){state.drawer=false;render(true)}
    else if(action==='toggle-settings'){state.settings=!state.settings;render(true)}
    else if(action==='new-ov'||action==='new-rv'){state.modal={type:'new',verificationType:action==='new-ov'?'OV':'RV'};render(true)}
    else if(action==='close-modal'){state.modal=null;render(true)}
    else if(action==='notifications')toast('Demo: 7 submissions pending; 5 signed PDFs awaiting upload')
    else if(action==='module-item'){const m=moduleConfig[state.page],i=Number(btn.dataset.item);if(m&&m.rows[i])toast(`${m.rows[i][0]} — planned for native Android implementation`)}
    else if(action==='logout'){doLogout();}
  });
  root.addEventListener('input',e=>{if(e.target.id!=='search-records')return;state.search=e.target.value;const r=rows();const tbody=root.querySelector('#record-table-body'),cards=root.querySelector('#mobile-records');if(tbody)tbody.innerHTML=r.table;if(cards)cards.innerHTML=r.cards;});
  root.addEventListener('submit',e=>{if(e.target.id!=='draft-form')return;e.preventDefault();const fd=new FormData(e.target);const customer=(fd.get('customer')||'').toString().trim(),product=(fd.get('product')||'').toString().trim(),serial=(fd.get('serial')||'').toString().trim();if(!customer||!product||!serial)return;const type=state.modal.verificationType;const index=state.records.filter(x=>x.status==='Draft').length+1;state.records.unshift({id:'DRAFT-'+String(index).padStart(3,'0'),customer,type,product:product+' · '+serial,status:'Draft',date:'Today'});state.modal=null;state.page='Dashboard';state.filter='All';state.search='';toast('Demo draft saved locally — not submitted to the VPS');});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.drawer)){state.modal=null;state.drawer=false;render(true);}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-record]')){e.preventDefault();state.modal={type:'record',id:e.target.dataset.record};render(true);}});
  render();
  } // end bootApp

  ensureSession();
})();
</script></body></html>
