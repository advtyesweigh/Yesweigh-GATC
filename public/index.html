    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>', scale:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6.2" opacity=".45"/><path d="M12 5.5V12l4 2"/><circle cx="12" cy="12" r="1.35" fill="#25D366" stroke="none"/><path d="m8.2 12.4 2.1 2.1 4.4-4.9" stroke="#25D366" stroke-width="2.2"/>',
    dashboard:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
    verification:'<rect x="5" y="3" width="14" height="19" rx="2"/><path d="M9 3V2h6v1M9 11l2 2 4-4M9 17h6"/>', people:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v2"/>',
    package:'<path d="m12 2 9 5v10l-9 5-9-5V7l9-5ZM3 7l9 5 9-5M12 12v10"/>', bag:'<path d="M4 9h16l-1 12H5L4 9ZM9 10V7a3 3 0 0 1 6 0v3"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M9 3h6l.7 2.5 1.5.7 2.4-1.1 2.4 4.3-2 1.6v2l2 1.6-2.4 4.3-2.4-1.1-1.5.7L15 21H9l-.7-2.5-1.5-.7-2.4 1.1L2 14.6 4 13v-2L2 9.4l2.4-4.3 2.4 1.1 1.5-.7L9 3Z"/>',
    truck:'<path d="M3 6h12v12H3zM15 10h4l3 4v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',flask:'<path d="M9 3h6M10 3v7L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3M7 16h10"/>',
    profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',down:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 5 7 7-7 7"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 10h18c0-3-3-3-3-10M10 21h4"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',plus:'<path d="M12 4v16M4 12h16"/>',refresh:'<path d="M20 7v6h-6M4 17v-6h6M5.5 9A8 8 0 0 1 20 13M18.5 15A8 8 0 0 1 4 11"/>',
    file:'<path d="M6 3h9l5 5v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM15 3v5h5M8 13h8M8 17h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',shield:'<path d="M12 2 21 6v6c0 5-4 8-9 10-5-2-9-5-9-10V6l9-4ZM8 12l3 3 5-5"/>',building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-5h4v5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>'
  };
  const icon = (n,cls='')=>`<svg aria-hidden="true" class="i ${cls}" viewBox="0 0 24 24">${I[n] || I.file}</svg>`;
  const esc = (v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nav = [{label:'Dashboard',ico:'dashboard'},{label:'Verification',ico:'verification'},{label:'Customer',ico:'people'},{label:'Product',ico:'package'}];
  const subnav = [{label:'VCT',ico:'people'},{label:'Vehicle',ico:'truck'},{label:'Laboratory',ico:'flask'}];
  const state = {page:'Dashboard',drawer:false,settings:true,filter:'All',period:'month',modal:null,records:[
    {id:'GATC-1042',customer:'Metro Weighing Solutions',type:'RV',product:'Electronic Scale · 30 kg',status:'Awaiting PDF',date:'31 Oct 2026'},
    {id:'GATC-1041',customer:'Royal Traders',type:'OV',product:'Platform Scale · 100 kg',status:'Completed',date:'30 Oct 2026'},
    {id:'GATC-1040',customer:'ABC Industries',type:'RV',product:'Electronic Scale · 50 kg',status:'Pending',date:'30 Oct 2026'},
    {id:'GATC-1039',customer:'Green Market',type:'OV',product:'Counter Scale · 20 kg',status:'Completed',date:'29 Oct 2026'}
  ], search:'', toast:null};
  let toastTimer;
  function listnav(items){return items.map(n=>`<button type="button" class="nav-btn ${state.page===n.label?'active':''}" data-page="${esc(n.label)}">${icon(n.ico)}<span class="nav-label">${esc(n.label)}</span></button>`).join('');}
  function sidebar(){const uname=escapeHtml(authState.user.username||authState.user.aadhaar||'RC Admin');const role=escapeHtml(authState.user.role||'RC_ADMIN');const initials=(authState.user.username||'RC').slice(0,2).toUpperCase();return `<div class="drawer-overlay ${state.drawer?'visible':''}" data-action="close-drawer"></div><aside class="sidebar ${state.drawer?'open':''}" aria-label="Primary navigation"><div class="sidebar-top"><div class="logo-row"><div class="logo-mark">${icon('scale','lg')}</div><div><div class="logo-title">GATC<em>.</em></div><div class="logo-note">VERIFICATION SYSTEM</div></div></div><div class="workspace"><span class="workspace-icon">${icon('building')}</span><div class="workspace-text"><b>RC Workspace</b><span>Regional Centre Admin</span></div>${icon('down','sm')}</div></div><nav class="sidebar-body"><div class="nav-caption">WORKSPACE</div>${listnav(nav)}<div class="nav-caption" style="margin-top:15px">MANAGEMENT</div><button class="nav-btn" data-action="toggle-settings">${icon('gear')}<span class="nav-label">Settings</span>${icon('down','sm')}</button>${state.settings?`<div class="subnav">${listnav(subnav)}</div>`:''}</nav><div class="sidebar-bottom">${listnav([{label:'Profile',ico:'profile'}])}<div class="account-foot"><div class="avatar">${escapeHtml(initials)}</div><div style="flex:1;min-width:0"><b>${uname}</b><small>${role}</small></div><button type="button" class="logout-btn" data-action="logout" title="Sign out">Sign out</button></div></div></aside>`;}
  function header(){return `<div class="mobile-status"><span>9:41</span><span>●●● &nbsp;◕ &nbsp;▰</span></div><header class="topbar"><button class="iconbtn menu-toggle" type="button" aria-label="Open left menu" data-action="open-drawer">${icon('menu')}</button><div class="crumb">GATC / <strong>${esc(state.page)}</strong></div><div class="mobile-brand"><b>GATC<em>.</em></b><small>RC ADMIN WORKSPACE</small></div><div class="top-spacer"></div><div class="top-right"><span class="online-pill"><span class="online-dot"></span> UI Preview</span><button type="button" class="iconbtn" aria-label="Notifications" data-action="notifications">${icon('bell','sm')}<span class="notify-dot"></span></button><button type="button" class="avatar" aria-label="Open profile" data-page="Profile">RC</button></div></header>`;}
  function statData(){const drafts=state.records.filter(r=>r.status==='Draft');const initial=state.period==='today'?{ov:3,rv:8,done:9,pending:2}:{ov:28,rv:72,done:88,pending:12};return {ov:initial.ov+drafts.filter(r=>r.type==='OV').length,rv:initial.rv+drafts.filter(r=>r.type==='RV').length,total:initial.ov+initial.rv+drafts.length,done:initial.done,pending:initial.pending+drafts.length};}
  function metrics(){const s=statData();const vals=[{name:'Total Verifications',num:s.total,ico:'verification',sub:'All verification requests'},{name:'Completed',num:s.done,ico:'check',sub:'Successfully completed',cls:'good'},{name:'Original (OV)',num:s.ov,ico:'file',sub:'Initial verifications'},{name:'Re-verify (RV)',num:s.rv,ico:'refresh',sub:'Periodic verifications'}];if(!isMobile){vals[1]={name:'Original (OV)',num:s.ov,ico:'file',sub:'Initial verification'};vals[2]={name:'Re-verification (RV)',num:s.rv,ico:'refresh',sub:'Periodic verification'};vals[3]={name:'Pending Actions',num:s.pending,ico:'clock',sub:'Requires your attention',cls:'warn'};}return `<div class="metrics">${vals.map(x=>`<article class="metric"><div class="metric-title-row"><span class="metric-title">${x.name}</span><span class="metric-icon ${x.cls||''}">${icon(x.ico,'sm')}</span></div><div class="metric-number">${x.num}</div><div class="metric-sub">${x.sub}</div></article>`).join('')}</div>`;}
  function hero(){return `<section class="hero"><div class="hero-text"><div class="hero-label">GATC VERIFICATION CENTRE</div><h2>${isMobile?'Start a verification':'Everything in one place.'}</h2><p>${isMobile?'New instrument or periodic verification.':'Manage instruments, pending work and certificates with ease.'}</p></div><div class="hero-actions"><button class="btn ${isMobile?'primary':'primary'}" data-action="new-ov">${icon('plus','sm')} New OV</button><button class="btn white" data-action="new-rv">${icon('refresh','sm')} New RV</button></div></section>`;}
  function attention(){return `<section class="panel"><div class="panel-head"><div><h3>Needs attention</h3><p>${isMobile?'':'Outstanding tasks and documents'}</p></div><span class="status pending">12 Open</span></div><div class="attention-row"><span class="attention-ico">${icon('clock')}</span><div class="attention-meta"><b>Pending submissions</b><small>Awaiting government processing</small></div><strong class="attention-value">7</strong></div><div class="attention-row"><span class="attention-ico blue">${icon('file')}</span><div class="attention-meta"><b>Signed PDFs pending</b><small>Certificates to upload</small></div><strong class="attention-value">5</strong></div></section>`;}
  function quick(){return `<section class="panel quick-panel"><div class="panel-head"><div><h3>Quick access</h3><p>Frequently used modules</p></div></div>${[{label:'Manage customers',page:'Customer',ico:'people'},{label:'Product master',page:'Product',ico:'package'},{label:'Manage VCT',page:'VCT',ico:'people'}].map(q=>`<button class="quick-link" data-page="${q.page}">${icon(q.ico)}<span>${q.label}</span>${icon('right','sm')}</button>`).join('')}</section>`;}
  function filteredRecords(){return state.records.filter(r=>(state.filter==='All'||r.type===state.filter)&&[r.id,r.customer,r.type,r.product,r.status].join(' ').toLowerCase().includes(state.search.toLowerCase())).slice(0,state.page==='Dashboard'?5:100);}
  function rows(){const items=filteredRecords();return {table:items.length?items.map(r=>`<tr data-record="${esc(r.id)}" tabindex="0" role="button" aria-label="View ${esc(r.id)}"><td><span class="record-customer">${esc(r.customer)}</span><span class="record-sub">${esc(r.product)}</span></td><td><span class="record-id">${esc(r.id)}</span></td><td>${esc(r.type)}</td><td><span class="status ${r.status==='Completed'?'completed':r.status==='Pending'?'pending':r.status==='Draft'?'draft':'pdf'}">${esc(r.status)}</span></td><td>${esc(r.date)}</td></tr>`).join(''):`<tr><td class="empty" colspan="5">No matching records</td></tr>`,cards:items.length?items.map(r=>`<button class="record-card" data-record="${esc(r.id)}"><span class="record-ico">${icon('verification')}</span><span class="record-main"><b>${esc(r.customer)}</b><small>${esc(r.id)} · ${esc(r.type)} · ${esc(r.product)}</small></span><span class="record-end"><span class="status ${r.status==='Completed'?'completed':r.status==='Pending'?'pending':r.status==='Draft'?'draft':'pdf'}">${esc(r.status)}</span><small>${esc(r.date)}</small></span></button>`).join(''):`<div class="empty">No matching verifications</div>`};}
  function recordsPanel(){const r=rows();return `<section class="panel record-panel"><div class="panel-head"><div><h3>${state.page==='Dashboard'?'Recent verifications':'Verification records'}</h3><p>Latest original and re-verification activities</p></div>${state.page==='Dashboard'?`<button class="linkbtn" data-page="Verification">View all →</button>`:''}</div><div class="record-tools"><label class="searchbox">${icon('search','sm')}<input id="search-records" placeholder="Search verification..." aria-label="Search verification records" value="${esc(state.search)}"/></label><div class="segmented">${['All','OV','RV'].map(f=>`<button class="segment ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div></div><table class="record-table"><thead><tr><th>CUSTOMER / INSTRUMENT</th><th>REFERENCE</th><th>TYPE</th><th>STATUS</th><th>DATE</th></tr></thead><tbody id="record-table-body">${r.table}</tbody></table><div class="mobile-records" id="mobile-records">${r.cards}</div><div class="panel-foot"><button class="linkbtn" data-page="Verification">View verification history ${icon('arrow','sm')}</button></div></section>`;}
  function dashboard(){return `${heading('Dashboard','RC ADMIN WORKSPACE','Verification overview and recent activity')}${hero()}<div class="section-row"><h3>Verification summary</h3><div class="segmented">${[['today','Today'],['month','This month']].map(([a,b])=>`<button class="segment ${state.period===a?'active':''}" data-period="${a}">${b}</button>`).join('')}</div></div>${metrics()}<div class="dashboard-grid">${recordsPanel()}<div class="side-column">${attention()}${quick()}</div></div><p class="ui-note">${icon('shield','sm')} Interactive reference only · Sample data · No connection to VPS or government portal</p>`;}
  function heading(title,eyebrow='RC WORKSPACE',desc=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1>${desc?`<p class="page-description">${esc(desc)}</p>`:''}</div><div class="date-chip">${icon('calendar','sm')}<span>31 October 2026</span>${isMobile?'31 Oct':''}</div></div>`;}
  const moduleConfig={
    Customer:{summary:'Customer directory and verification history',ico:'people',rows:[['Customer directory','View and search customers'],['Add customer','Create a customer record'],['Customer history','Related OV, RV and certificates']]},
    Product:{summary:'Instrument and product master',ico:'package',rows:[['Product catalogue','Instrument types, capacities and models'],['Add product','Create a product master entry'],['Product categories','Manage classifications']]},
    VCT:{summary:'Manage VCT members within your RC',ico:'people',rows:[['VCT directory','View VCT users'],['Create VCT','Add a VCT account'],['Assigned verifications','Review assigned work']]},
    Vehicle:{summary:'Vehicles associated with the RC',ico:'truck',rows:[['Vehicle directory','View registered vehicles'],['Add vehicle','Create vehicle record']]},
    Laboratory:{summary:'Laboratory details and equipment',ico:'flask',rows:[['Laboratory profile','Centre profile and facilities'],['Equipment register','Review laboratory equipment']]},
    Profile:{summary:'RC Administrator profile',ico:'profile',rows:[['Account details','Account and contact information'],['Security','Password and session settings'],['RC information','Regional Centre profile']]}
  };
  function modulePage(){if(state.page==='Verification')return `${heading('Verification','RC ADMIN WORKSPACE','Original and re-verification requests')}${hero()}${recordsPanel()}<p class="ui-note">${icon('shield','sm')} UI prototype only. Request submission is not enabled.</p>`;const m=moduleConfig[state.page]||moduleConfig.Customer;return `${heading(state.page,'RC ADMIN WORKSPACE',m.summary)}<section class="panel module-panel"><div class="module-icon">${icon(m.ico,'lg')}</div><h2 class="module-title">${esc(state.page)} management</h2><p class="module-summary">${esc(m.summary)}. Fields and workflows will be verified against the existing yesgatc project.</p><div class="module-list">${m.rows.map((r,i)=>`<button class="module-item" data-action="module-item" data-item="${i}">${icon(m.ico)}<span><b>${esc(r[0])}</b><small>${esc(r[1])}</small></span>${icon('right','sm')}</button>`).join('')}</div></section><p class="ui-note">${icon('shield','sm')} Reference UI only. No live records are changed.</p>`;}
  function modal(){const m=state.modal;if(!m)return '';if(m.type==='record'){const r=state.records.find(x=>x.id===m.id);if(!r)return '';return `<div class="modal-layer" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Verification details"><div class="modal-title-row"><h2>Verification details</h2><button class="close-btn" data-action="close-modal" aria-label="Close">${icon('close')}</button></div>${[['Reference',r.id],['Customer',r.customer],['Type',r.type],['Instrument',r.product],['Status',r.status],['Date',r.date]].map(([a,b])=>`<div class="detail-line"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<p class="form-note">This is sample data. Documents and government acknowledgements are not connected.</p><div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div></div></div>`;}const type=m.verificationType;return `<div class="modal-layer" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-title-row"><h2 id="modal-title">New ${type==='OV'?'Original Verification':'Re-Verification'}</h2><button class="close-btn" data-action="close-modal" aria-label="Close">${icon('close')}</button></div><form id="draft-form"><label class="field-label" for="customer">Customer name</label><input class="text-field" id="customer" name="customer" maxlength="100" placeholder="Enter customer name" required/><label class="field-label" for="product">Instrument / product</label><input class="text-field" id="product" name="product" maxlength="100" placeholder="e.g. Electronic weighing scale" required/><label class="field-label" for="serial">Serial number</label><input class="text-field" id="serial" name="serial" maxlength="80" placeholder="Enter instrument serial" required/><p class="form-note">Quick UI demonstration. Saves a draft in browser memory only, without uploading anything.</p><div class="modal-actions"><button type="button" class="btn outline" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save demo draft ${icon('arrow','sm')}</button></div></form></div></div>`;}
  function render(preserveScroll=false){const scrollTop=preserveScroll?(root.querySelector('.scroll')?.scrollTop||0):0;root.innerHTML=`<div class="app">${sidebar()}<div class="main">${header()}<div class="scroll"><div class="content">${state.page==='Dashboard'?dashboard():modulePage()}</div></div>${isMobile?`<div class="bottom-bar"><span>${icon('shield','sm')} Sample UI only</span><button data-action="new-ov">+ New verification</button></div>`:''}</div>${modal()}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}</div>`;if(preserveScroll){const scroll=root.querySelector('.scroll');if(scroll)scroll.scrollTop=scrollTop;}if(state.modal?.type==='new')root.querySelector('#customer')?.focus();}
  function toast(message){state.toast=message;render(true);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;render(true)},2700)}
  root.addEventListener('click',e=>{
    const btn=e.target.closest('button,[data-record],[data-backdrop]');if(!btn)return;
    if(btn.dataset.backdrop==='1'&&e.target===btn){state.modal=null;render(true);return;}
    if(btn.dataset.page){state.page=btn.dataset.page;state.drawer=false;state.filter='All';state.search='';render();return;}
    if(btn.dataset.period){state.period=btn.dataset.period;render(true);return;}
    if(btn.dataset.filter){state.filter=btn.dataset.filter;render(true);return;}
    if(btn.dataset.record){state.modal={type:'record',id:btn.dataset.record};render(true);return;}
    const action=btn.dataset.action;
    if(action==='open-drawer'){state.drawer=true;render(true)}
    else if(action==='close-drawer'){state.drawer=false;render(true)}
    else if(action==='toggle-settings'){state.settings=!state.settings;render(true)}
    else if(action==='new-ov'||action==='new-rv'){state.modal={type:'new',verificationType:action==='new-ov'?'OV':'RV'};render(true)}
    else if(action==='close-modal'){state.modal=null;render(true)}
    else if(action==='notifications')toast('Demo: 7 submissions pending; 5 signed PDFs awaiting upload')
    else if(action==='module-item'){const m=moduleConfig[state.page],i=Number(btn.dataset.item);if(m&&m.rows[i])toast(`${m.rows[i][0]} — planned for native Android implementation`)}
    else if(action==='logout'){doLogout();}
  });
  root.addEventListener('input',e=>{if(e.target.id!=='search-records')return;state.search=e.target.value;const r=rows();const tbody=root.querySelector('#record-table-body'),cards=root.querySelector('#mobile-records');if(tbody)tbody.innerHTML=r.table;if(cards)cards.innerHTML=r.cards;});
  root.addEventListener('submit',e=>{if(e.target.id!=='draft-form')return;e.preventDefault();const fd=new FormData(e.target);const customer=(fd.get('customer')||'').toString().trim(),product=(fd.get('product')||'').toString().trim(),serial=(fd.get('serial')||'').toString().trim();if(!customer||!product||!serial)return;const type=state.modal.verificationType;const index=state.records.filter(x=>x.status==='Draft').length+1;state.records.unshift({id:'DRAFT-'+String(index).padStart(3,'0'),customer,type,product:product+' · '+serial,status:'Draft',date:'Today'});state.modal=null;state.page='Dashboard';state.filter='All';state.search='';toast('Demo draft saved locally — not submitted to the VPS');});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.drawer)){state.modal=null;state.drawer=false;render(true);}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-record]')){e.preventDefault();state.modal={type:'record',id:e.target.dataset.record};render(true);}});
  render();
  } // end bootApp

  ensureSession();
})();
</script></body></html>
