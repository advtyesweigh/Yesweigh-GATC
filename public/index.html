  async function ensureSession() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
      renderLogin({ step: 'credentials' });
      return;
    }
    const { res, json } = await api('/api/v1/auth/me', { token });
    if (!res.ok) {
      clearAuth();
      renderLogin({
        step: 'credentials',
        error: json.error?.code === 'SESSION_REVOKED'
          ? 'Signed in on another device. Please sign in again.'
          : 'Session expired. Please sign in again.',
      });
      return;
    }
    localStorage.setItem(USER_KEY, JSON.stringify(json.data.user || {}));
    bootApp(token, json.data.user || {});
  }

      lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.3M21 3v6h-6"/>',
      arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
      back:'<path d="m14 5-7 7 7 7M7 12h14"/>',
      wind:'<path d="M4 12h12a3 3 0 1 0-3-3M4 7h8a2.5 2.5 0 1 0-2.5-2.5M4 17h14a2.5 2.5 0 1 1-2.5 2.5"/>',
      more:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',
    };
    const icon = (n, cls='') => `<svg aria-hidden="true" class="i ${cls}" viewBox="0 0 24 24">${I[n] || I.dashboard}</svg>`;
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const n = (v) => Number(v || 0).toLocaleString();
    const money = (v) => `₹${Number(v || 0).toLocaleString('en-IN')}`;
    const fmtDate = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    };
    const fmtDateTime = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '—';
      const date = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${date} ${time}`;
    };
    const periodLabel = () => ({ today:'Today', month:'This month', quarter:'This Qtr', year:'This Year', all:'Lifetime' }[state.period] || state.period);
    const statusTone = (status) => {
      const s = String(status || '').toLowerCase();
      if (s === 'certified' || s === 'approved' || s === 'completed' || s === 'active' || s === 'verified') return 'ok';
      if (s === 'submitted' || s === 'pending' || s === 'pending_rc') return 'blue';
      if (s === 'draft') return 'warn';
      if (s.includes('fail') || s === 'rejected' || s === 'expired' || s === 'inactive') return 'bad';
      return 'muted';
    };
    const statusBadge = (status) => {
      const cls = statusTone(status);
      return `<span class="sa-badge ${cls === 'muted' ? '' : cls}">${esc(status || '—')}</span>`;
    };
    const statusLabelText = (r) => {
      if (r.status_label) return r.status_label;
      const s = String(r.status || '').toLowerCase();
      if (s === 'certified' || s === 'approved') return 'Verified';
      return r.status || '—';
    };

    async function doLogout() {
      try { await api('/api/v1/auth/logout', { method: 'POST', token: authState.token }); } catch (_) {}
      clearAuth();
      renderLogin({ step: 'credentials' });
    }

    function toast(msg) {
      state.toast = msg;
      render(true);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { state.toast = null; render(true); }, 2400);
    }

    function onAuthFail(json, res) {
      if (json.error?.code === 'UNAUTHORIZED' || res.status === 401) {
        clearAuth();
        renderLogin({ step: 'credentials', error: 'Session expired. Please sign in again.' });
        return true;
      }
      return false;
    }

    async function loadDash(silent) {
      if (!silent) state.loading = true;
      const { res, json } = await api(`/api/v1/admin/dashboard?period=${encodeURIComponent(state.period)}`, { token: authState.token });
      if (!res.ok) {
        state.loading = false;
        state.error = json.error?.message || 'Could not load dashboard';
        if (onAuthFail(json, res)) return;
        render(true);
        return;
      }
      state.dash = json.data;
      state.loading = false;
      state.error = null;
      render(true);
    }

    function listPath() {
      const q = encodeURIComponent(state.q || '');
      const lim = state.list.limit || listLimitFor(state.page);
      const off = state.list.offset || 0;
      const pageNum = Math.floor(off / lim) + 1;
      if (state.page === 'Verification') {
        const st = encodeURIComponent(state.statusFilter || '');
        const ty = encodeURIComponent(state.typeFilter || '');
        const rc = encodeURIComponent(state.rcFilter || '');
        const period = encodeURIComponent(state.period || 'month');
        return `/api/v1/admin/verifications?limit=${lim}&offset=${off}&page=${pageNum}&q=${q}&status=${st}&type=${ty}&rcId=${rc}&rc=${rc}&period=${period}`;
      }
      if (state.page === 'Regional Centers') return `/api/v1/admin/regional-centers?q=${q}`;
      if (state.page === 'Products') {
        const tab = encodeURIComponent(state.subTab || 'Active');
        return `/api/v1/admin/products?limit=${lim}&offset=${off}&q=${q}&tab=${tab}`;
      }
      if (state.page === 'VCT') {
        const tab = encodeURIComponent(state.subTab || 'Active');
        return `/api/v1/admin/users?role=VCT&limit=${lim}&offset=${off}&q=${q}&tab=${tab}`;
      }
      if (state.page === 'Customers') return `/api/v1/admin/customers?limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'RC Quota') return `/api/v1/admin/quota?limit=${lim}&offset=${off}&q=${q}`;
      if (state.page === 'RC Wallet') {
        const tab = encodeURIComponent(state.subTab || 'balances');
        return `/api/v1/admin/wallets?limit=${lim}&offset=${off}&q=${q}&view=${tab}&tab=${tab}`;
      }
      if (state.page === 'Vehicles') {
        const tab = encodeURIComponent(state.subTab || 'All');
        return `/api/v1/admin/vehicles?limit=${lim}&offset=${off}&q=${q}&tab=${tab}`;
      }
      return null;
    }

    function normalizeRcOptions(items) {
      return (items || [])
        .map((rc) => ({
          id: String(rc.id || ''),
          code: rc.code || '',
          name: rc.name || rc.company_name || rc.code || 'RC',
        }))
        .filter((rc) => rc.id)
        .sort((a, b) => String(a.name).localeCompare(String(b.name)));
    }

    async function loadRcOptions(silent) {
      if (state.rcOptions?.length) return;
      const fromDash = normalizeRcOptions(state.dash?.regionalCenters);
      if (fromDash.length) {
        state.rcOptions = fromDash;
        return;
      }
      const { res, json } = await api('/api/v1/admin/regional-centers', { token: authState.token });
      if (!res.ok) {
        if (!silent) state.listError = json.error?.message || 'Could not load regional centres';
        if (onAuthFail(json, res)) return;
        return;
      }
      state.rcOptions = normalizeRcOptions(json.data?.items);
    }

    async function loadList(silent) {
      const path = listPath();
      if (!path) return;
      if (!silent) state.listLoading = true;
      state.listError = null;
      render(true);
      const { res, json } = await api(path, { token: authState.token });
      if (!res.ok) {
        state.listLoading = false;
        state.listError = json.error?.message || 'Could not load list';
        if (onAuthFail(json, res)) return;
        render(true);
        return;
      }
      const data = json.data || {};
      state.list = {
        total: data.total || 0,
        items: data.items || [],
        limit: data.limit != null ? data.limit : (state.list.limit || listLimitFor(state.page)),
        offset: data.offset != null ? data.offset : (state.list.offset || 0),
        summary: data.summary || null,
      };
      state.listLoading = false;
      state.listError = null;
      render(true);
    }

    function goPage(page, opts = {}) {
      const nextPage = PAGE_TO_HASH[page] ? page : (pageFromHash(page) || 'Dashboard');
      const prevPage = state.page;
      state.page = nextPage;
      state.drawer = false;
      state.productDetail = null;
      state.productDetailLoading = false;
      state.productDetailError = null;
      state.vehicleDetail = null;
      state.vctDetail = null;
      state.entityModal = null;
      state.q = opts.q != null ? opts.q : '';
      state.statusFilter = opts.statusFilter != null ? opts.statusFilter : '';
      state.typeFilter = opts.typeFilter != null ? opts.typeFilter : '';
      // Keep RC filter when switching Verification tabs; clear when leaving the page.
      state.rcFilter = opts.rcFilter != null
        ? opts.rcFilter
        : (nextPage === 'Verification' && prevPage === 'Verification' ? state.rcFilter : '');
      {
        const defaults = {
          'RC Wallet': 'balances',
          Vehicles: 'All',
          Laboratory: 'menu',
          Products: 'Active',
          VCT: 'Active',
          'Regional Centers': 'All',
        };
        const incoming = opts.tab != null ? String(opts.tab) : '';
        state.subTab = incoming || defaults[nextPage] || '';
      }
      if (nextPage === 'Regional Centers' && opts.rcSort == null) state.rcSort = 'total-desc';
      state.list = { total: 0, items: [], limit: listLimitFor(nextPage), offset: 0, summary: null };
      state.listError = null;
      // Paint first so a hash-write failure can never leave Dashboard stuck while URL moved.
      render();
      if (!opts.skipHash) writePageHash(nextPage);
      if (LIST_PAGES.has(nextPage)) {
        if (nextPage === 'Verification') {
          loadRcOptions(true).finally(() => loadList());
        } else {
          loadList();
        }
      }
      else if (nextPage === 'Dashboard') loadDash(true);
      else if (nextPage === 'Settings' || nextPage === 'Integrations') {
        loadEmaapStatus(true);
        loadYesoneStatus(true);
        loadRazorpayStatus(true);
        loadZohoStatus(true);
      }
    }

    function isNavOn(m) {
      if (state.page !== m.id) return false;
      if (m.filter) {
        return state.typeFilter === (m.filter.typeFilter || '') &&
          state.statusFilter === (m.filter.statusFilter || '');
      }
      if (m.tab != null) {
        const defaults = {
          'RC Wallet': 'balances',
          Vehicles: 'All',
          Laboratory: 'menu',
          Products: 'Active',
          VCT: 'Active',
        };
        const current = state.subTab || defaults[m.id] || '';
        return current === m.tab;
      }
      return true;
    }

    function sidebar() {
      const uname = esc(authState.user.username || 'super_admin');
      const initials = uname.slice(0, 2).toUpperCase();
      const items = MENUS.map((m) => {
        const attrs = [`data-page="${esc(m.id)}"`];
        if (m.filter) {
          if (m.filter.typeFilter) attrs.push(`data-type-filter="${esc(m.filter.typeFilter)}"`);
          if (m.filter.statusFilter) attrs.push(`data-status-filter="${esc(m.filter.statusFilter)}"`);
        }
        if (m.tab) attrs.push(`data-tab="${esc(m.tab)}"`);
        return `<button type="button" class="sa-navbtn ${isNavOn(m)?'on':''}" ${attrs.join(' ')}>${icon(m.ico)}<span>${esc(m.label)}</span></button>`;
      }).join('');
      return `<div class="sa-overlay ${state.drawer ? 'on' : ''}" data-action="close-drawer"></div>
      <aside class="sa-side ${state.drawer ? 'open' : ''}">
        <div class="sa-side-top">
          <div class="sa-brand">
            <div class="sa-logo">${icon('shield')}</div>
            <div><b>GATC</b><small>Government Approved<br>Test Centre</small></div>
        </div>
        </div>
        <nav class="sa-nav">
          <div class="sa-cap">WORKSPACE</div>
          ${items}
        </nav>
        <div class="sa-foot">
          <div class="sa-user"><div class="sa-av">${initials}</div><div style="flex:1;min-width:0"><b style="font-size:12px">${uname}</b><span style="display:block;font-size:10px;color:#7b8799">Super Admin</span></div>
          <button type="button" class="sa-out" data-action="logout">Sign out</button></div>
        </div>
      </aside>`;
    }

    function topbar() {
      return `<header class="sa-top sa-top--minimal">
        <button type="button" class="sa-menu" data-action="open-drawer" aria-label="Menu">${icon('menu')}</button>
      </header>`;
    }

    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '—';
      return ((parts[0][0] || '') + (parts[1]?.[0] || parts[0][1] || '')).toUpperCase();
    }

    function avatarHtml(url, name) {
      const ini = esc(initialsOf(name));
      const src = withAuthMediaUrl(url);
      if (src) {
        return `<span class="sa-avimg"><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove();this.parentNode.textContent='${ini}'"/></span>`;
      }
      return `<span class="sa-avimg">${ini}</span>`;
    }

    function heading(title, sub, extraRight = '') {
      const right = extraRight
        ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${extraRight}</div>`
        : '';
      return `<div class="sa-h-row"><div><div class="eye">SUPER ADMIN</div><h1 style="margin:0;font-family:Outfit,system-ui,sans-serif;font-size:1.7rem;letter-spacing:-.04em">${esc(title)}</h1><p style="margin:4px 0 0;color:#334155;font-size:13px;font-weight:650">${esc(sub)}</p></div>${right}</div>`;
    }

    function periodButtons() {
      const opts = [['today','Today'],['month','This month'],['quarter','This Qtr'],['year','This Year'],['all','Lifetime']];
      return `<div class="sa-periods" role="group" aria-label="Period">${opts.map(([k,l]) => `<button type="button" class="${state.period===k?'on':''}" data-period="${k}">${l}</button>`).join('')}</div>`;
    }

    function dashboard() {
      const d = state.dash || {};
      const byType = d.byType || { OV: 0, RV: 0 };
      const st = d.byStatus || {};
      const cert = d.certified || {};
      const totals = d.totals || {};
      const rcs = d.regionalCenters || [];
      const vcts = (d.topVcts || []).filter((v) => Number(v.certified) > 0);
      const periodCount = (byType.OV || 0) + (byType.RV || 0);
      const stages = [
        ['submitted', 'Submitted', 'blue', 'file'],
        ['failed_submit', 'Failed', 'red', 'alert'],
        ['draft', 'Draft', 'violet', 'edit'],
        ['certified', 'Certified', 'green', 'award'],
        ['rejected', 'Rejected', 'gray', 'ban'],
      ];
      if (state.loading && !state.dash) {
        return `${heading('Dashboard', 'Verification overview', periodButtons())}<p class="ui-note">Loading dashboard…</p>`;
      }
      if (state.error && !state.dash) {
        return `${heading('Dashboard', 'Verification overview', periodButtons())}<p class="auth-error" role="alert">${esc(state.error)}</p>
          <button class="btn primary" data-action="refresh">Retry</button>`;
      }
      return `${heading('Dashboard', 'Verification overview', periodButtons())}
        <section class="sa-hero" aria-label="Verification types">
          <button type="button" class="sa-type ov" data-page="Verification" data-type-filter="OV"><span class="top"><span class="badge">OV</span>${icon('layers')}</span><span class="num">${n(byType.OV)}</span><span class="tiny">Original verification</span></button>
          <button type="button" class="sa-type rv" data-page="Verification" data-type-filter="RV"><span class="top"><span class="badge">RV</span>${icon('shield')}</span><span class="num">${n(byType.RV)}</span><span class="tiny">Re-verification</span></button>
          <div class="sa-scope">
            <span class="lbl">Period scope</span>
            <span class="val">${esc(periodLabel())}</span>
            <span class="sub">${n(periodCount)} verifications</span>
          </div>
        </section>
        <div class="sa-stage-grid" aria-label="Verification stages">
          ${stages.map(([key,label,tone,ico]) => {
            const count = st[key] || (key==='certified' ? (st.certified || cert.lifetime || 0) : 0);
            return `<div class="sa-stage-card ${tone}"><div class="row"><span class="lbl">${esc(label)}</span><span class="sa-stage-ico ${tone}">${icon(ico,'sm')}</span></div><span class="cnt">${n(count)}</span></div>`;
          }).join('')}
          </div>
        <section class="sa-mid" aria-label="Certified totals">
          <div class="sa-q orange"><span class="ico">${icon('chart')}</span><div><b>Total Certified</b><strong>${n(cert.last_month)}</strong><small>Last month</small></div></div>
          <div class="sa-q green"><span class="ico">${icon('award')}</span><div><b>Total Certified</b><strong>${n(cert.this_month)}</strong><small>This month</small></div></div>
        </section>
        <div class="sa-stats">
          <button type="button" class="sa-stat sa-stat-btn" data-page="Regional Centers"><span>Regional Centers</span><b>${n(totals.regional_centers)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="VCT"><span>VCT</span><b>${n(totals.vct)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="Products"><span>Products</span><b>${n(totals.products)}</b></button>
          <button type="button" class="sa-stat sa-stat-btn" data-page="Customers"><span>Customers</span><b>${n(totals.customers)}</b></button>
        </div>
        <div class="sa-lists">
        <section class="sa-panel">
          <div class="sa-panel-h"><h2>Regional Centers</h2><button type="button" class="sa-link" data-page="Regional Centers">View All →</button></div>
            ${rcs.length ? `<ul class="sa-rc">${rcs.map((rc,i)=>`<li><span class="rank">#${i+1}</span>${avatarHtml(rc.logoUrl, rc.name || rc.code)}<div class="body"><b>${esc(rc.name || rc.code || 'RC')}</b><span>${esc(rc.code || rc.district || '—')}</span></div><span class="cnt">${n(rc.certified)}</span></li>`).join('')}</ul>` : `<p class="ui-note">No regional centers yet.</p>`}
          </section>
          <section class="sa-panel">
            <div class="sa-panel-h"><h2>VCT</h2><button type="button" class="sa-link" data-page="VCT">View All →</button></div>
            ${vcts.length ? `<ul class="sa-vct">${vcts.map((v,i)=>`<li><span class="rank">#${i+1}</span>${avatarHtml(v.photoUrl, v.name)}<div class="body"><b>${esc(v.name || 'VCT')}</b><span>${esc(v.rc_name || v.rc_code || '—')}</span></div><span class="cnt">${n(v.certified)}</span></li>`).join('')}</ul>` : `<p class="ui-note">No VCT performance yet.</p>`}
          </section>
        </div>`;
    }

    function statusTabsHtml(page, tab) {
      return `<div class="sa-tabs" role="tablist" aria-label="Status filters">
          ${[['Active', 'Active'], ['Inactive', 'Inactive']].map(([k, l]) =>
            `<button type="button" class="${tab === k ? 'on' : ''}" data-page="${esc(page)}" data-tab="${k}" role="tab" aria-selected="${tab === k ? 'true' : 'false'}">${l}</button>`
          ).join('')}
        </div>`;
    }

    function listTools(extra = '', { leading = '', search = true } = {}) {
      if (!search) {
        return `<div class="sa-tools">${leading}${extra}</div>`;
      }
      return `<div class="sa-tools">
        ${leading}
        <label class="sa-search">${icon('search','sm')}<input id="sa-q" type="search" placeholder="Search…" value="${esc(state.q)}" aria-label="Search"/></label>
        ${extra}
        <button type="button" class="sa-btn" data-action="list-search">Search</button>
        <button type="button" class="sa-btn ghost" data-action="list-reset">Reset</button>
      </div>`;
    }

    function pager(placement = '') {
      const { total, limit, offset } = state.list;
      const from = total ? offset + 1 : 0;
      const to = Math.min(offset + limit, total);
      const canPrev = offset > 0;
      const canNext = offset + limit < total;
      const cls = placement === 'top' ? 'sa-pager top' : 'sa-pager';
      return `<div class="${cls}" role="navigation" aria-label="${placement === 'top' ? 'List pagination top' : 'List pagination'}">
        <span>Showing ${n(from)}–${n(to)} of ${n(total)}</span>
        <div style="display:flex;gap:8px">
          <button type="button" class="sa-btn ghost" data-action="list-prev" ${canPrev?'':'disabled'}>Previous</button>
          <button type="button" class="sa-btn ghost" data-action="list-next" ${canNext?'':'disabled'}>Next</button>
        </div>
      </div>`;
    }

    function withAuthMediaUrl(url) {
      if (!url) return '';
      const u = String(url);
      if (!u.startsWith('/api/')) return u;
      const sep = u.includes('?') ? '&' : '?';
      return `${u}${sep}access_token=${encodeURIComponent(authState.token || '')}`;
    }

    function verificationCard(r) {
      const type = String(r.verification_type || '').toUpperCase();
      const tone = statusTone(r.status_label || r.status);
      const label = statusLabelText(r);
      const ref = r.reference || r.certificate_number || r.application_number || '—';
      const when = fmtDateTime(r.certified_at || r.submitted_at || r.created_at);
      const thumbSrc = r.product_image_url ? withAuthMediaUrl(r.product_image_url) : '';
      const thumb = `${icon('layers')}${thumbSrc
        ? `<img src="${esc(thumbSrc)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>`
        : ''}`;
      const dlUrl = r.download_url || r.signed_pdf_url || r.certificate_pdf_url || '';
      const viewUrl = r.signed_pdf_url || r.download_url || r.certificate_pdf_url || '';
      const pdfFileBase = String(ref || '').trim();
      const pdfFileName = pdfFileBase && pdfFileBase !== '—'
        ? `${pdfFileBase.replace(/\.pdf$/i, '').replace(/[\\/]+/g, '-').replace(/[^\w.\-]+/g, '_')}.pdf`
        : 'certificate.pdf';
      const pdfBadge = viewUrl
        ? `<a class="sa-vcard-pdf" href="${esc(viewUrl)}" data-action="open-pdf" data-url="${esc(viewUrl)}" data-disposition="inline" data-filename="${esc(pdfFileName)}" title="Open certificate PDF">${r.has_signed_pdf || r.signed_pdf_url ? 'Signed PDF' : 'PDF'}</a>`
        : '';
      const rc = r.rc_name || r.rc_code || '';
      const canDl = Boolean(dlUrl);
      const dlHref = dlUrl.startsWith('/api/')
        ? `${esc(dlUrl)}${dlUrl.includes('?') ? '&' : '?'}disposition=attachment`
        : esc(dlUrl);
      const pdfIco = `<svg class="sa-pdf-ico" viewBox="0 0 22 26" aria-hidden="true" focusable="false"><rect x="1" y="1" width="20" height="24" rx="2.5" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><path d="M1 1h14l6 6v3H1V1Z" fill="#dc2626"/><path d="M15 1v6h6" fill="#fecaca"/><text x="11" y="19" text-anchor="middle" font-size="7.5" font-weight="800" font-family="Outfit,system-ui,sans-serif" fill="#dc2626">PDF</text></svg>`;
      const dlBtn = canDl
        ? `<a class="sa-vcard-dl" href="${dlHref}" data-action="open-pdf" data-url="${esc(dlUrl)}" data-disposition="attachment" data-filename="${esc(pdfFileName)}" title="Download ${esc(pdfFileName)}" aria-label="Download ${esc(pdfFileName)}">${pdfIco}<span>Download</span></a>`

    function newCapacityLocalId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return `spec-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function computeDerivedCapacity(maxRaw, eRaw) {
      const max = Number(maxRaw);
      const e = Number(eRaw);
      const has = Number.isFinite(max) && max > 0 && Number.isFinite(e) && e > 0;
      if (!has) return { min: '', d: '', n: '' };
      const round = (v) => String(Math.round(v * 1e6) / 1e6);
      return { min: round(e * 20), d: round(e), n: round((max * 1000) / e) };
    }

    function emptyCapacityRow(seed = {}) {
      const max = seed.maximum_capacity ?? seed.maximumCapacity ?? '';
      const e = seed.verification_scale_interval ?? seed.verificationScaleInterval ?? '';
      const mpe = seed.maximum_permissible_error ?? seed.maximumPermissibleError ?? '';
      const derived = computeDerivedCapacity(max, e);
      return {
        id: seed.id || newCapacityLocalId(),
        maximum_capacity: max === null || max === undefined ? '' : String(max),
        verification_scale_interval: e === null || e === undefined ? '' : String(e),
        maximum_permissible_error: mpe === null || mpe === undefined ? '' : String(mpe),
        minimum_capacity: derived.min || (seed.minimum_capacity ?? seed.minimumCapacity ?? ''),
        actual_scale_interval: derived.d || (seed.actual_scale_interval ?? seed.actualScaleInterval ?? ''),
        no_of_verification_intervals: derived.n || (seed.no_of_verification_intervals ?? seed.noOfVerificationIntervals ?? ''),
      };
    }

    function capacityRowsFromProduct(p = {}) {
      const specs = Array.isArray(p.specifications) ? p.specifications : [];
      if (specs.length) return specs.map((s) => emptyCapacityRow(s));
      if (
        p.maximum_capacity != null
        || p.verification_scale_interval != null
        || p.maximumCapacity != null
        || p.verificationScaleInterval != null
      ) {
        return [emptyCapacityRow(p)];
      }
      return [emptyCapacityRow()];
    }

    function productCapacityRowHtml(row, index, total) {
      const derived = computeDerivedCapacity(row.maximum_capacity, row.verification_scale_interval);
      const min = derived.min || row.minimum_capacity || '';
      const d = derived.d || row.actual_scale_interval || '';
      const n = derived.n || row.no_of_verification_intervals || '';
      return `<div class="sa-cap-row" data-cap-row data-cap-id="${esc(row.id || '')}">
        <div class="sa-cap-row-top">
          <span>Capacity ${index + 1}</span>
          ${total > 1
            ? `<button type="button" class="sa-btn ghost" data-action="product-cap-remove" data-index="${index}" aria-label="Remove capacity ${index + 1}">Remove</button>`
            : ''}
        </div>
        <div class="sa-cap-grid">
          <div class="sa-pfield blue"><label>Max *</label><input type="number" step="any" inputmode="decimal" data-cap-field="maximum_capacity" value="${esc(row.maximum_capacity || '')}" placeholder="30"/></div>
          <div class="sa-pfield blue"><label>e *</label><input type="number" step="any" inputmode="decimal" data-cap-field="verification_scale_interval" value="${esc(row.verification_scale_interval || '')}" placeholder="5"/></div>
          <div class="sa-pfield blue"><label>MPE</label><input type="number" step="any" inputmode="decimal" data-cap-field="maximum_permissible_error" value="${esc(row.maximum_permissible_error || '')}" placeholder="—"/></div>
          <div class="sa-pfield green"><label>Min</label><input type="text" data-cap-derived="minimum_capacity" value="${esc(min)}" readonly tabindex="-1"/></div>
          <div class="sa-pfield green"><label>d</label><input type="text" data-cap-derived="actual_scale_interval" value="${esc(d)}" readonly tabindex="-1"/></div>
          <div class="sa-pfield green"><label>n</label><input type="text" data-cap-derived="no_of_verification_intervals" value="${esc(n)}" readonly tabindex="-1"/></div>
        </div>
      </div>`;
    }

    function readCapacityRowsFromDom(rootEl) {
      if (!rootEl) return [];
      return Array.from(rootEl.querySelectorAll('[data-cap-row]')).map((rowEl) => {
        const get = (name) => {
          const el = rowEl.querySelector(`[data-cap-field="${name}"]`);
          return el ? el.value : '';
        };
        const getDerived = (name) => {
          const el = rowEl.querySelector(`[data-cap-derived="${name}"]`);
          return el ? el.value : '';
        };
        return emptyCapacityRow({
          id: rowEl.getAttribute('data-cap-id') || newCapacityLocalId(),
          maximum_capacity: get('maximum_capacity'),
          verification_scale_interval: get('verification_scale_interval'),
          maximum_permissible_error: get('maximum_permissible_error'),
          minimum_capacity: getDerived('minimum_capacity'),
          actual_scale_interval: getDerived('actual_scale_interval'),
          no_of_verification_intervals: getDerived('no_of_verification_intervals'),
        });
      });
    }

    function refreshCapacityDerived(rowEl) {
      if (!rowEl) return;
      const maxEl = rowEl.querySelector('[data-cap-field="maximum_capacity"]');
      const eEl = rowEl.querySelector('[data-cap-field="verification_scale_interval"]');
      const derived = computeDerivedCapacity(maxEl?.value, eEl?.value);
      const set = (name, val) => {
        const el = rowEl.querySelector(`[data-cap-derived="${name}"]`);
        if (el) el.value = val;
      };
      set('minimum_capacity', derived.min);
      set('actual_scale_interval', derived.d);
      set('no_of_verification_intervals', derived.n);
    }

          ${fieldHtml('Model', 'model', d.model)}
          ${fieldHtml('Year', 'year', d.year)}
          ${fieldHtml('Registration', 'reg_number', d.reg_number)}
          <div class="sa-pfield span2"><label>Regional Centre *</label><select name="rc_id" data-field="rc_id">${rcSelectOptions(d.rc_id)}</select></div>
          ${fieldHtml('RC valid till', 'rc_validity', toDate(d.rc_validity), { type: 'date' })}
          ${fieldHtml('Insurance valid till', 'insurance_validity', toDate(d.insurance_validity), { type: 'date' })}
          ${fieldHtml('Pollution valid till', 'pollution_validity', toDate(d.pollution_validity), { type: 'date' })}
          ${fieldHtml('F2 weight valid till', 'f2_weight_validity', toDate(d.f2_weight_validity), { type: 'date' })}
          ${fieldHtml('Active', 'active', d.active !== false, { type: 'checkbox' })}`;
      }
      return '';
    }

    function entityModalMeta(kind, mode) {
      const titles = {
        rc: mode === 'create' ? 'Add regional centre' : 'Edit regional centre',
        product: mode === 'create' ? 'Add product' : 'Edit product',
        vct: mode === 'create' ? 'Add VCT' : 'Edit VCT',
        vehicle: mode === 'create' ? 'Add vehicle' : 'Edit vehicle',
      };
      const subs = {
        rc: 'SQL regional_centers — media stored on VPS',
        product: 'Instrument master in Postgres',
        vct: 'Technician login (VCT role)',
        vehicle: 'RC-registered vehicle (Car)',
      };
      return { title: titles[kind] || 'Edit', sub: subs[kind] || '' };
    }

    function entityModalHtml() {
      const m = state.entityModal;
      if (!m) return '';
      const meta = entityModalMeta(m.kind, m.mode);
      const wide = m.kind === 'rc';
      const panel = m.kind === 'product';
      const gridClass = wide ? 'sa-pgrid sa-pgrid--2' : 'sa-pgrid';
      const dialogClass = panel
        ? 'sa-entity-dialog sa-entity-dialog--panel'
        : (wide ? 'sa-entity-dialog sa-entity-dialog--wide' : 'sa-entity-dialog');
      const layerClass = panel ? 'sa-entity-modal sa-entity-modal--panel' : 'sa-entity-modal';
      const body = m.loading
        ? '<p class="sa-meta">Loading…</p>'
        : `<div class="${gridClass}">${entityModalFields(m.kind, m.mode, m.data)}</div>
           ${m.error ? `<p class="sa-meta" style="color:var(--bad)">${esc(m.error)}</p>` : ''}`;
      return `<div class="${layerClass}" data-backdrop="entity" role="dialog" aria-modal="true" aria-label="${esc(meta.title)}">
        <div class="${dialogClass}">
          <div class="sa-entity-head"><div><h2>${esc(meta.title)}</h2><p class="sub">${esc(meta.sub)}</p></div>
            <button type="button" class="sa-btn ghost" data-action="close-entity-modal" aria-label="Close">✕</button></div>
          <div class="sa-entity-body">${body}</div>
          <div class="sa-entity-foot">
            <button type="button" class="sa-btn ghost" data-action="close-entity-modal">Cancel</button>
            <button type="button" class="sa-btn" data-action="save-entity-modal"${m.saving || m.loading ? ' disabled' : ''}>${m.saving ? 'Saving…' : 'Save'}</button>
          </div>
        </div>
      </div>`;
    }

    function closeEntityModal() {
      if (!state.entityModal) return;
      state.entityModal = null;
      render(true);
    }

    function readEntityForm() {
      const rootEl = root.querySelector('.sa-entity-dialog');
      if (!rootEl) return {};
      const out = {};
      rootEl.querySelectorAll('[data-field]').forEach((el) => {
        const key = el.getAttribute('data-field');
        if (!key) return;
        if (el.type === 'checkbox') out[key] = el.checked;
        else out[key] = el.value;
      });
      return out;
    }

    function hydrateProductFormData(raw) {
      const data = { ...(raw || {}) };
      data.capacityRows = capacityRowsFromProduct(data);
      if (data.image_source_url == null && data.image_url && !String(data.image_url).startsWith('/api/')) {
        data.image_source_url = data.image_url;
      }
      return data;
    }

    async function openEntityModal(kind, { mode = 'edit', id = null, seed = null } = {}) {
      if (kind === 'vct' || kind === 'vehicle' || kind === 'rc') {
        await loadRcOptions(true);
      }
      state.productDetail = null;
      state.vctDetail = null;
      state.vehicleDetail = null;
      const seedData = kind === 'product' ? hydrateProductFormData(seed || {}) : (seed || {});
      state.entityModal = {
        kind,
        mode,
        id: id || null,
        loading: Boolean(mode === 'edit' && id),
        saving: false,
        error: null,
        data: seedData,
      };
      render(true);
      if (mode === 'create') return;
      if (!id) return;
      const paths = {
        rc: `/api/v1/admin/regional-centers/${encodeURIComponent(id)}`,
        product: `/api/v1/admin/products/${encodeURIComponent(id)}`,
        vct: `/api/v1/admin/users/${encodeURIComponent(id)}`,
        vehicle: `/api/v1/admin/vehicles/${encodeURIComponent(id)}`,
      };
      const { res, json } = await api(paths[kind], { token: authState.token });
      if (!state.entityModal || state.entityModal.kind !== kind || String(state.entityModal.id || '') !== String(id)) return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        state.entityModal = {
          ...state.entityModal,
          loading: false,
          error: json.error?.message || 'Could not load record',
          data: seedData,
        };
        toast(state.entityModal.error);
        render(true);
        return;
      }
      const loaded = json.data || seed || {};
      state.entityModal = {
        ...state.entityModal,
        loading: false,
        error: null,
        data: kind === 'product' ? hydrateProductFormData(loaded) : loaded,
      };
      render(true);
    }

    async function uploadRcMedia(kind, file) {
      const m = state.entityModal;
      if (!m || m.kind !== 'rc' || m.mode !== 'edit' || !m.id || !file) return;
      const fd = new FormData();
      fd.append('file', file, file.name || `${kind}.bin`);
      toast('Uploading…');
      const { res, json } = await api(
        `/api/v1/admin/regional-centers/${encodeURIComponent(m.id)}/media?kind=${encodeURIComponent(kind)}`,
        { method: 'POST', token: authState.token, formData: fd },
      );
      if (!state.entityModal || state.entityModal.kind !== 'rc') return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        toast(json.error?.message || 'Upload failed');
        return;
      }
      state.entityModal = {
        ...state.entityModal,
        data: { ...(json.data || state.entityModal.data) },
        error: null,
      };
      toast('Uploaded to VPS');
      render(true);
    }

    async function clearRcMedia(kind) {
      const m = state.entityModal;
      if (!m || m.kind !== 'rc' || m.mode !== 'edit' || !m.id || !kind) return;
      const { res, json } = await api(
        `/api/v1/admin/regional-centers/${encodeURIComponent(m.id)}/media?kind=${encodeURIComponent(kind)}`,
        { method: 'DELETE', token: authState.token },

      if (!state.entityModal || state.entityModal.kind !== 'rc') return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        toast(json.error?.message || 'Clear failed');
        return;
      }
      state.entityModal = {
        ...state.entityModal,
        data: { ...(json.data || state.entityModal.data) },
        error: null,
      };
      toast('Cleared');
      render(true);
    }

    async function uploadProductMedia(kind, file) {
      const m = state.entityModal;
      if (!m || m.kind !== 'product' || m.mode !== 'edit' || !m.id || !file) return;
      const fd = new FormData();
      fd.append('file', file, file.name || `${kind}.bin`);
      toast('Uploading…');
      const { res, json } = await api(
        `/api/v1/admin/products/${encodeURIComponent(m.id)}/media?kind=${encodeURIComponent(kind)}`,
        { method: 'POST', token: authState.token, formData: fd },
      );

    async function saveEntityModal() {
      const m = state.entityModal;
      if (!m || m.saving) return;
      const body = readEntityForm();
      if (m.kind === 'rc' && !String(body.company_name || '').trim()) {
        toast('Company / Centre is required');
        return;
      }
      if (m.kind === 'rc' && m.mode === 'create' && !String(body.code || '').trim()) {
        toast('RC code is required');
        return;
      }
      if (m.kind === 'product' && !String(body.name || '').trim()) {
        toast('Product name is required');
        return;
      }
      if (m.kind === 'product' && m.mode === 'create' && !String(body.model_id || '').trim()) {
        toast('Model ID is required');
        return;
      }
      if (m.kind === 'vct') {
        if (!String(body.username || '').trim()) { toast('Name is required'); return; }
        if (!String(body.rc_id || '').trim()) { toast('Regional Centre is required'); return; }
        if (m.mode === 'create') {
          if (String(body.aadhaar || '').replace(/\D/g, '').length !== 12) { toast('Aadhaar must be 12 digits'); return; }
          if (String(body.password || '').length < 8) { toast('Password must be at least 8 characters'); return; }
        }
        body.role = 'VCT';
      }
      if (m.kind === 'vehicle') {
        if (!String(body.rc_id || '').trim()) { toast('Regional Centre is required'); return; }
        if (!String(body.brand || '').trim() && !String(body.reg_number || '').trim()) {
          toast('Brand or registration is required');
          return;
        }
      }
      if (m.kind === 'product') {
        body.pas_pre_allotted = String(body.serial_pool || '').toUpperCase() === 'PAS';
        const capRows = readCapacityRowsFromDom(root.querySelector('.sa-entity-dialog'));
        const specifications = [];
        for (const row of capRows) {
          const max = Number(row.maximum_capacity);
          const e = Number(row.verification_scale_interval);
          if (!Number.isFinite(max) || max <= 0 || !Number.isFinite(e) || e <= 0) {
            toast('Each capacity needs Max and e greater than zero');
            return;
          }
          const derived = computeDerivedCapacity(max, e);
          specifications.push({
            id: row.id || newCapacityLocalId(),
            maximumCapacity: max,
            verificationScaleInterval: e,
            maximumPermissibleError: Number(row.maximum_permissible_error) || 0,
            minimumCapacity: Number(derived.min) || e * 20,
            actualScaleInterval: Number(derived.d) || e,
            noOfVerificationIntervals: Number(derived.n) || ((max * 1000) / e),
          });
        }
        if (!specifications.length) {
          toast('Add at least one capacity row');
          return;
        }
        body.specifications = specifications;
        const primary = specifications[0];
        body.maximum_capacity = primary.maximumCapacity;
        body.verification_scale_interval = primary.verificationScaleInterval;
        body.maximum_permissible_error = primary.maximumPermissibleError;
        body.minimum_capacity = primary.minimumCapacity;
        body.actual_scale_interval = primary.actualScaleInterval;
        body.no_of_verification_intervals = primary.noOfVerificationIntervals;
        // Always send image URL key so blank clears remote source.
        body.image_source_url = body.image_source_url || '';
        delete body.image_url;
      }
      if (body.password === '') delete body.password;
      if (body.aadhaar === '') delete body.aadhaar;
      const endpoints = {
        rc: m.mode === 'create' ? '/api/v1/admin/regional-centers' : `/api/v1/admin/regional-centers/${encodeURIComponent(m.id)}`,
        product: m.mode === 'create' ? '/api/v1/admin/products' : `/api/v1/admin/products/${encodeURIComponent(m.id)}`,
        vct: m.mode === 'create' ? '/api/v1/admin/users' : `/api/v1/admin/users/${encodeURIComponent(m.id)}`,
        vehicle: m.mode === 'create' ? '/api/v1/admin/vehicles' : `/api/v1/admin/vehicles/${encodeURIComponent(m.id)}`,
      };
      state.entityModal = { ...m, saving: true, error: null };
      render(true);
      const { res, json } = await api(endpoints[m.kind], {
        method: m.mode === 'create' ? 'POST' : 'PATCH',
        token: authState.token,
        body,
      });
      if (!state.entityModal) return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        const err = json.error?.message || 'Save failed';
        state.entityModal = { ...state.entityModal, saving: false, error: err };
        toast(err);
        render(true);
        return;
      }
      state.entityModal = null;
      toast(m.mode === 'create' ? 'Created' : 'Saved');
      render(true);
      loadList(true);
      if (m.kind === 'rc') {
        state.rcOptions = [];
        loadRcOptions(true);
      }
    }

    function rcLocationLabel(r) {
      return r.location_label || [r.place, r.district, r.state].filter(Boolean).join(', ')
        || r.pincode || (r.address ? String(r.address).split(/\n/)[0].trim() : '') || '—';
    }

    function rcPlaceLabel(r) {
      return r.place || r.district || rcLocationLabel(r);
    }

    function rcIsActive(r) {
      return r.active !== false;
    }

    function rcFilteredItems() {
      const tab = state.subTab || 'All';
      let items = [...(state.list.items || [])];
      if (tab === 'Active') items = items.filter(rcIsActive);
      else if (tab === 'Inactive') items = items.filter((r) => !rcIsActive(r));
      // Always Total high → low (name as tie-breaker)
      items.sort((a, b) => {
        const an = String(a.name || a.code || '').toLowerCase();
        const bn = String(b.name || b.code || '').toLowerCase();
        const at = Number(a.total ?? a.verifications) || 0;
        const bt = Number(b.total ?? b.verifications) || 0;
        return bt - at || an.localeCompare(bn);
      });
      return items;
    }

    function rcExportCsv() {
      const items = rcFilteredItems();
      const headers = ['#', 'RC Name', 'RC Code', 'Location', 'Car', 'VCT', 'OV', 'RV', 'Total', 'Status'];
      const lines = [headers.join(',')];
      const cell = (v) => {
        const s = String(v ?? '');
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      items.forEach((r, i) => {
        const ov = r.ov_count ?? r.ov ?? 0;
        const rv = r.rv_count ?? r.rv ?? 0;
        const car = r.car_count ?? r.vehicle_count ?? 0;
        const total = r.total ?? r.verifications ?? (Number(ov) + Number(rv));
        lines.push([
          i + 1,
          r.name || r.code || '',
          r.code || '',
          rcLocationLabel(r),
          car,
          r.vct_count ?? 0,
          ov,
          rv,
          total,
          rcIsActive(r) ? 'Active' : 'Inactive',
        ].map(cell).join(','));
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `regional-centres-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast(`Exported ${items.length} centres`);
    }

    function rcList() {
      const allItems = state.list.items || [];
      const sum = state.list.summary || {};
      const tab = state.subTab || 'All';
      const items = rcFilteredItems();
      const activeCount = sum.active != null
        ? Number(sum.active)
        : allItems.filter(rcIsActive).length;
      const inactiveCount = sum.inactive != null
        ? Number(sum.inactive)
        : allItems.filter((r) => !rcIsActive(r)).length;
      const allCount = sum.centres != null ? Number(sum.centres) : allItems.length;
      const kpiCentres = state.listLoading ? '…' : n(allCount);
      const kpiVct = state.listLoading ? '…' : n(sum.vct_count != null
        ? sum.vct_count
        : allItems.reduce((s, r) => s + (Number(r.vct_count) || 0), 0));
      const ovCount = sum.ov_count != null
        ? Number(sum.ov_count)
        : allItems.reduce((s, r) => s + (Number(r.ov_count ?? r.ov) || 0), 0);
      const rvCount = sum.rv_count != null
        ? Number(sum.rv_count)
        : allItems.reduce((s, r) => s + (Number(r.rv_count ?? r.rv) || 0), 0);
      const totalJobs = sum.total != null
        ? Number(sum.total)
        : (sum.verifications != null ? Number(sum.verifications) : ovCount + rvCount);
      const kpiOv = state.listLoading ? '…' : n(ovCount);
      const kpiRv = state.listLoading ? '…' : n(rvCount);
      const kpiTotal = state.listLoading ? '…' : n(totalJobs);
      const kpiCars = state.listLoading ? '…' : n(sum.car_count != null
        ? sum.car_count
        : allItems.reduce((s, r) => s + (Number(r.car_count ?? r.vehicle_count) || 0), 0));
      const foot = { car: 0, vct: 0, ov: 0, rv: 0, total: 0 };
      const rows = items.length ? items.map((r, i) => {
        const ov = r.ov_count ?? r.ov ?? 0;
        const rv = r.rv_count ?? r.rv ?? 0;
        const car = r.car_count ?? r.vehicle_count ?? 0;
        const vct = r.vct_count ?? 0;
        const total = r.total ?? r.verifications ?? (Number(ov) + Number(rv));
        foot.car += Number(car) || 0;
        foot.vct += Number(vct) || 0;
        foot.ov += Number(ov) || 0;
        foot.rv += Number(rv) || 0;
        foot.total += Number(total) || 0;
        return `<tr>
          <td><span class="sa-rc-idx">${i + 1}</span></td>
          <td>
            <button type="button" class="sa-name-btn sa-rc-name" data-action="open-rc" data-id="${esc(r.id)}">${esc(r.name || r.code)}</button>
            <span class="sub">${esc(r.code || '')}</span>
          </td>
          <td><span class="sa-rc-code">${esc(r.code || '—')}</span></td>
          <td><span class="sa-rc-loc">${icon('pin','sm')}${esc(rcPlaceLabel(r))}</span></td>
          <td class="num" title="Active vehicles">${n(car)}</td>
          <td class="num">${n(vct)}</td>
          <td class="num" title="Original Verification">${n(ov)}</td>
          <td class="num" title="Re-verification">${n(rv)}</td>
          <td class="num"><strong>${n(total)}</strong></td>
        </tr>`;
      }).join('') : `<tr><td colspan="9" class="sa-empty">${state.listLoading ? 'Loading…' : (state.listError ? esc(state.listError) : 'No regional centres found')}</td></tr>`;
      const footer = items.length ? `<tfoot><tr>
          <td colspan="4"><span class="sa-rc-total-label">Total</span></td>
          <td class="num" title="Sum of cars">${n(foot.car)}</td>
          <td class="num" title="Sum of VCTs">${n(foot.vct)}</td>
          <td class="num" title="Sum of OV">${n(foot.ov)}</td>
          <td class="num" title="Sum of RV">${n(foot.rv)}</td>
          <td class="num"><strong>${n(foot.total)}</strong></td>
        </tr></tfoot>` : '';
      const tabs = [
        ['All', `All Centres (${n(allCount)})`, ''],
        ['Active', `Active (${n(activeCount)})`, 'check'],
        ['Inactive', `Inactive (${n(inactiveCount)})`, 'ban'],
      ].map(([k, label, ico]) => {
        const icoCls = k === 'Active' ? 'tab-ok' : (k === 'Inactive' ? 'tab-off' : '');
        return `<button type="button" class="${tab === k ? 'on' : ''}" data-action="rc-tab" data-tab="${k}" role="tab" aria-selected="${tab === k ? 'true' : 'false'}">${ico ? `<span class="${icoCls}">${icon(ico,'sm')}</span>` : ''}${esc(label)}</button>`;
      }).join('');
      return `${heading('Regional Centres', 'Manage centres, VCTs and certification progress')}
        <div class="sa-kpi sa-kpi-6">
          <div class="card tint-blue"><div class="t">Total Centres<span class="ico">${icon('building')}</span></div><div class="v">${kpiCentres}</div><div class="s">Regional centres</div></div>
          <div class="card tint-green"><div class="t">Total VCTs<span class="ico green">${icon('people')}</span></div><div class="v">${kpiVct}</div><div class="s">Active technicians</div></div>
          <div class="card tint-purple"><div class="t">OV Count<span class="ico purple">${icon('file')}</span></div><div class="v">${kpiOv}</div><div class="s">Original verifications</div></div>
          <div class="card tint-orange"><div class="t">RV Count<span class="ico orange">${icon('award')}</span></div><div class="v">${kpiRv}</div><div class="s">Re-verifications</div></div>
          <div class="card tint-indigo"><div class="t">Total<span class="ico indigo">${icon('layers')}</span></div><div class="v">${kpiTotal}</div><div class="s">OV + RV verifications</div></div>
          <div class="card tint-teal"><div class="t">Total Cars<span class="ico teal">${icon('car')}</span></div><div class="v">${kpiCars}</div><div class="s">Active vehicles</div></div>
        </div>
        <section class="sa-panel">
          <div class="sa-tools sa-rc-toolbar">
            <div class="sa-tabs" role="tablist" aria-label="Centre status">${tabs}</div>
            <label class="sa-search">${icon('search','sm')}<input id="sa-q" type="search" placeholder="Search by RC name, code, location..." value="${esc(state.q)}" aria-label="Search regional centres"/><kbd>⌘ K</kbd></label>
            <div class="sa-actions">
              <button type="button" class="sa-btn ghost" data-action="rc-export">${icon('download')} Export</button>
              <button type="button" class="sa-btn sa-add" data-action="entity-create" data-kind="rc">${icon('plus')} Add RC</button>
            </div>
          </div>
          <div class="sa-table-wrap"><table class="sa-table sa-rc-table">
            <thead><tr>
              <th>#</th><th>RC Name</th><th>RC Code</th><th>Location</th><th>Car</th><th>VCT</th><th>OV</th><th>RV</th><th>Total</th>
            </tr></thead>
            <tbody>${rows}</tbody>
            ${footer}
          </table></div>
        </section>`;
    }

    function productThumbHtml(r, sizeClass = '', { full = false } = {}) {
      const src = withAuthMediaUrl(
        full ? (r.image_url || r.image_thumb_url || '') : (r.image_thumb_url || r.image_url || ''),
      );
      return `<span class="sa-pthumb${src ? ' has-img' : ''}${sizeClass ? ` ${sizeClass}` : ''}" aria-hidden="true">${icon('package')}${
        src
          ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>`
          : ''
      }</span>`;
    }

    function productSpecChip(label, value) {
      const v = value == null || value === '' ? '—' : String(value);
      return `<div><small>${esc(label)}</small><b title="${esc(v)}">${esc(v)}</b></div>`;
    }

    function productCard(r) {
      const name = r.name || '—';
      const model = r.model_no || r.model_id || '';
      const unit = r.unit_of_measurement || 'kg';
      const specs = Array.isArray(r.specifications) && r.specifications.length
        ? r.specifications
        : [{
          maximum_capacity: r.maximum_capacity,
          minimum_capacity: r.minimum_capacity,
          verification_scale_interval: r.verification_scale_interval,
          actual_scale_interval: r.actual_scale_interval,
          maximum_permissible_error: r.maximum_permissible_error,
          no_of_verification_intervals: r.no_of_verification_intervals,
        }];
      const primary = specs[0] || {};
      const maxLabel = primary.maximum_capacity != null ? `${primary.maximum_capacity} ${unit}` : '—';
      const multiMax = specs.length > 1
        ? specs.map((s) => (s.maximum_capacity != null ? `${s.maximum_capacity}` : null)).filter(Boolean).join(' · ')
        : null;
      const isPas = Boolean(r.pas_pre_allotted) || r.serial_pool === 'PAS';
      const photo = withAuthMediaUrl(r.image_url || r.image_thumb_url || '');
      const ph = `${icon('package')}${photo
        ? `<img src="${esc(photo)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>`
        : ''}`;
      const modelHtml = model
        ? `<div class="model" title="${esc(model)}"><span class="lbl">MODEL</span><span class="num">${esc(model)}</span></div>`
        : '';
      const footBits = [];
      if (r.model_approval_no) footBits.push(`<span>Approval <strong>${esc(r.model_approval_no)}</strong></span>`);
      if (r.supply_voltage) footBits.push(`<span>V <strong>${esc(r.supply_voltage)}</strong></span>`);
      if (multiMax) footBits.push(`<span>Caps <strong>${esc(multiMax)} ${esc(unit)}</strong></span>`);
      return `<article class="sa-prodcard" role="button" tabindex="0" data-action="open-product" data-id="${esc(r.id)}" aria-label="Open ${esc(name)}">
        <div class="ph">${ph}</div>
        <div class="sa-prodcard-main">
          <div class="sa-prodcard-head">
            <h3>${esc(name)}</h3>
            ${r.active ? '<span class="sa-badge ok">Active</span>' : '<span class="sa-badge off">Inactive</span>'}
          </div>
          ${modelHtml}
          <div class="sa-tags">
            ${r.type_of_instrument ? `<span class="sa-tag">${esc(r.type_of_instrument)}</span>` : ''}
            ${r.manufacturer_brand_series ? `<span class="sa-tag">${esc(r.manufacturer_brand_series)}</span>` : ''}
            ${r.accuracy_class ? `<span class="sa-tag">Class ${esc(r.accuracy_class)}</span>` : ''}
            <span class="sa-tag">${isPas ? 'PAS' : 'GAS'}</span>
            ${specs.length > 1 ? `<span class="sa-tag">${specs.length} caps</span>` : ''}
          </div>
          <div class="sa-prod-specs">
            ${productSpecChip('MAX', maxLabel)}
            ${productSpecChip('MIN', primary.minimum_capacity)}
            ${productSpecChip('E', primary.verification_scale_interval)}
            ${productSpecChip('D', primary.actual_scale_interval)}
            ${productSpecChip('MPE', primary.maximum_permissible_error)}
            ${productSpecChip('N', primary.no_of_verification_intervals)}
          </div>
          <div class="sa-prodcard-foot">
            <div class="sa-prodcard-meta">${footBits.join('<span class="sep" aria-hidden="true">·</span>')}</div>
            <div class="sa-prodcard-actions">
              <button type="button" class="sa-prodcard-ico" data-action="open-product" data-id="${esc(r.id)}" title="View product" aria-label="View ${esc(name)}">${icon('eye')}</button>
            </div>
          </div>
        </div>
      </article>`;

    function vctThumbHtml(r, sizeClass = '') {
      const src = withAuthMediaUrl(r.photo_thumb_url || r.photo_url || '');
      return `<span class="sa-pthumb${src ? ' has-img' : ''}${sizeClass ? ` ${sizeClass}` : ''}" aria-hidden="true">${icon('user')}${
        src
          ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>`
          : ''
      }</span>`;
    }

    function fmtSpec(v) {
      if (v == null || v === '') return '—';
      return String(v);
    }

    async function openProductDetail(id) {
      if (!id) return;
      const fromList = (state.list.items || []).find((p) => String(p.id) === String(id));
      state.productDetail = fromList || { id };
      state.productDetailLoading = true;
      state.productDetailError = null;
      render(true);
      const { res, json } = await api(`/api/v1/admin/products/${encodeURIComponent(id)}`, {
        token: authState.token,
      });
      if (!state.productDetail || String(state.productDetail.id) !== String(id)) return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        state.productDetailLoading = false;
        state.productDetailError = json.error?.message || 'Could not load product';
        toast(state.productDetailError);
        render(true);
        return;
      }
      state.productDetail = json.data || fromList || { id };
      state.productDetailLoading = false;
      state.productDetailError = null;
      render(true);
    }

    function closeProductDetail() {
      state.productDetail = null;
      state.productDetailLoading = false;
      state.productDetailError = null;
      render(true);
      if (!(state.list.items || []).length) loadList(true);
    }

            <div class="sa-prod-detail-head">

                ${modelHtml}

                  ${p.type_of_instrument ? `<span class="sa-tag">${esc(p.type_of_instrument)}</span>` : ''}
                  ${p.manufacturer_brand_series ? `<span class="sa-tag">${esc(p.manufacturer_brand_series)}</span>` : ''}
                  ${p.accuracy_class ? `<span class="sa-tag">Class ${esc(p.accuracy_class)}</span>` : ''}
                  <span class="sa-tag">${isPas ? 'PAS' : 'GAS'}</span>
                </div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;flex:none">
                ${p.active ? '<span class="sa-badge ok">Active</span>' : '<span class="sa-badge off">Inactive</span>'}

            </div>
          </div>
          <div class="sa-pgrid">
            <div class="sa-pfield"><label>Model ID *</label><input type="text" readonly value="${esc(p.model_id || '')}"/></div>
            <div class="sa-pfield"><label>Model No</label><input type="text" readonly value="${esc(p.model_no || '')}"/></div>
            <div class="sa-pfield"><label>Yesone SKU</label><input type="text" readonly value="${esc(p.yesone_sku || '')}" placeholder="Yesone SKU"/></div>
            <div class="sa-pfield"><label>Serial pool</label>
              <div class="sa-pserial" aria-label="Serial pool">
                <span class="${isPas ? '' : 'on'}">GAS</span>

              <span class="hint" style="font-size:11px;color:var(--muted);margin-top:4px">${isPas ? 'Pre-allotted serials (Yesone bank).' : 'General allotted serials (default).'}</span>
            </div>
            <div class="sa-pfield span2"><label>Product Name *</label><input type="text" readonly value="${esc(p.name || '')}"/></div>

    function productsList() {
      // Detail editing uses shared entity modal (open-product).

        ? `<div class="sa-prod">${items.map(productCard).join('')}</div>`

          <p class="sa-meta">${countLabel}${state.listError ? ` · ${esc(state.listError)}` : ''}</p>

    async function openVctDetail(id) {
      if (!id) return;
      const fromList = (state.list.items || []).find((x) => String(x.id) === String(id));
      state.vctDetail = { id, loading: true, error: null, data: fromList || null };
      render(true);
      const { res, json } = await api(`/api/v1/admin/users/${encodeURIComponent(id)}`, {
        token: authState.token,
      });
      if (!state.vctDetail || String(state.vctDetail.id) !== String(id)) return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        state.vctDetail = {
          id,
          loading: false,
          error: json.error?.message || 'Could not load VCT',
          data: fromList || null,
        };
        toast(state.vctDetail.error);
        render(true);
        return;
      }
      state.vctDetail = { id, loading: false, error: null, data: json.data || fromList || null };
      render(true);

      state.vctDetail = null;
      render(true);
      if (!(state.list.items || []).length) loadList(true);

    async function openVehicleDetail(id) {
      if (!id) return;
      const fromList = (state.list.items || []).find((x) => String(x.id) === String(id));
      state.vehicleDetail = {
        id,
        loading: true,
        error: null,
        data: fromList || null,
      };
      render(true);
      const { res, json } = await api(`/api/v1/admin/vehicles/${encodeURIComponent(id)}`, {
        token: authState.token,
      });
      if (!state.vehicleDetail || String(state.vehicleDetail.id) !== String(id)) return;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        state.vehicleDetail = {
          id,
          loading: false,
          error: json.error?.message || 'Could not load vehicle',
          data: fromList || null,
        };
        toast(state.vehicleDetail.error);
        render(true);
        return;
      }
      state.vehicleDetail = {
        id,
        loading: false,
        error: null,
        data: json.data || fromList || null,
      };
      render(true);
    }

    function formatYesoneSyncWhen(iso) {
      if (!iso) return 'Never';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString();
      } catch {
        return String(iso);
      }
    }

    function yesoneSyncSummary(sync) {
      if (!sync) return 'No sync runs yet.';
      if (sync.running) return 'Sync in progress…';
      if (sync.lastError) return `Error: ${sync.lastError}`;
      const run = sync.lastRun;
      if (!run) return sync.lastSuccessAt ? `Last success ${formatYesoneSyncWhen(sync.lastSuccessAt)}` : 'No sync runs yet.';
      const u = run.upserted || {};
      const parts = [];
      const vi = (u.verificationsInserted || 0) + (u.verificationsUpdated || 0);
      if (vi) parts.push(`${vi} verification${vi === 1 ? '' : 's'}`);
      const ui = (u.usersInserted || 0) + (u.usersUpdated || 0);
      if (ui) parts.push(`${ui} user${ui === 1 ? '' : 's'}`);
      const rc = u.regionalCenters || 0;
      if (rc) parts.push(`${rc} RC`);
      const pdf = run.pdfDownloaded || 0;
      if (pdf) parts.push(`${pdf} PDF`);
      const tail = parts.length ? parts.join(', ') : 'no changes';
      return `Last success ${formatYesoneSyncWhen(sync.lastSuccessAt)} · ${tail}`;
    }

    function applyRazorpayStatus(data) {
      const d = data || {};
      state.razorpay = {

    function loadRazorpayCheckoutScript() {
      return new Promise((resolve, reject) => {
        if (window.Razorpay) {
          resolve(window.Razorpay);
          return;
        }
        const existing = document.querySelector('script[data-gatc-razorpay-checkout]');
        if (existing) {
          existing.addEventListener('load', () => resolve(window.Razorpay));
          existing.addEventListener('error', () => reject(new Error('Could not load Razorpay Checkout')));
          return;
        }
        const s = document.createElement('script');
        s.src = 'https://checkout.razorpay.com/v1/checkout.js';
        s.async = true;
        s.dataset.gatcRazorpayCheckout = '1';
        s.onload = () => resolve(window.Razorpay);
        s.onerror = () => reject(new Error('Could not load Razorpay Checkout'));
        document.head.appendChild(s);
      });
    }

    async function runRazorpayTestPayment() {
      if (state.razorpayTest?.busy) return;
      if (!state.razorpay?.configured) {
        toast('Connect Razorpay before running a test payment');
        return;
      }
      const amountRaw = (root.querySelector('#razorpay-test-amount')?.value || '1').trim();
      const amountInr = Number(amountRaw);
      if (!Number.isFinite(amountInr) || amountInr < 1) {
        toast('Enter a valid amount in INR (minimum ₹1)');
        return;
      }
      const receipt = (root.querySelector('#razorpay-test-receipt')?.value || '').trim();
      const note = (root.querySelector('#razorpay-test-note')?.value || '').trim();
      const liveWarn = 'This uses LIVE Razorpay keys and will charge REAL money. Continue with ₹'
        + amountInr.toFixed(2) + '?';
      if (!window.confirm(liveWarn)) return;

      state.razorpayTest = { busy: true, lastResult: null };
      render(true);
      try {
        const { res, json } = await api('/api/v1/admin/integrations/razorpay/test-order', {
          method: 'POST',
          token: authState.token,
          body: { amountInr, receipt: receipt || undefined, note: note || undefined },
        });
        if (!res.ok) {
          if (onAuthFail(json, res)) return;
          state.razorpayTest = { busy: false, lastResult: { ok: false, message: json.error?.message || 'Order failed' } };
          toast(json.error?.message || 'Could not create test order');
          render(true);
          return;
        }
        const order = json.data || {};
        const RazorpayCtor = await loadRazorpayCheckoutScript();
        await new Promise((resolve) => {
          const rzp = new RazorpayCtor({
            key: order.keyId,
            amount: order.amount,
            currency: order.currency || 'INR',
            name: 'GATC test payment',
            description: note || 'Admin Razorpay connectivity test',
            order_id: order.orderId,
            theme: { color: '#2563eb' },
            handler: async (response) => {
              try {
                const verify = await api('/api/v1/admin/integrations/razorpay/verify-payment', {
                  method: 'POST',
                  token: authState.token,
                  body: {
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature,
                  },
                });
                if (!verify.res.ok || !verify.json?.data?.verified) {
                  const httpHint = !verify.res.ok
                    ? `Verify request failed (HTTP ${verify.res.status})`
                    : 'Signature verification failed';
                  state.razorpayTest = {
                    busy: false,
                    lastResult: {
                      ok: false,
                      message: verify.json?.error?.message || httpHint,
                      paymentId: response.razorpay_payment_id || null,
                    },
                  };
                  toast(state.razorpayTest.lastResult.message);
                } else {
                  state.razorpayTest = {
                    busy: false,
                    lastResult: {
                      ok: true,
                      message: 'Payment verified',
                      paymentId: verify.json.data.paymentId,
                      orderId: verify.json.data.orderId,
                      amountInr: order.amountInr,
                    },
                  };
                  toast('Test payment success — signature verified');
                }
              } catch (err) {
                state.razorpayTest = {
                  busy: false,
                  lastResult: { ok: false, message: err.message || 'Verify failed' },
                };
                toast(state.razorpayTest.lastResult.message);
              }
              render(true);
              resolve();
            },
            modal: {
              ondismiss: () => {
                state.razorpayTest = {
                  busy: false,
                  lastResult: { ok: false, message: 'Checkout closed without payment' },
                };
                render(true);
                resolve();
              },
            },
          });
          rzp.on('payment.failed', (resp) => {
            const desc = resp?.error?.description || resp?.error?.reason || 'Payment failed';
            state.razorpayTest = {
              busy: false,
              lastResult: { ok: false, message: desc },
            };
            toast(desc);
            render(true);
            resolve();
          });
          rzp.open();
        });
      } catch (err) {
        state.razorpayTest = {
          busy: false,
          lastResult: { ok: false, message: err.message || 'Test payment failed' },
        };
        toast(state.razorpayTest.lastResult.message);
        render(true);
      }
    }

    async function startZohoOAuthPopup() {
      if (state.zohoBusy) return;
      state.zohoBusy = true;
      render(true);
      const { res, json } = await api('/api/v1/admin/integrations/zoho/oauth/start', { token: authState.token });
      state.zohoBusy = false;
      if (!res.ok) {
        if (onAuthFail(json, res)) return;
        toast(json.error?.message || 'Could not start Zoho sign-in');
        render(true);
        return;
      }
      const url = json.data?.authorizeUrl;
      if (!url) {
        toast('Zoho authorize URL missing');
        render(true);
        return;
      }
      // Zoho accounts pages set CSP/X-Frame-Options that block iframes — use centered OAuth popup.
      const w = 520;
      const h = 720;
      const left = Math.max(0, Math.round((window.screen.width - w) / 2));
      const top = Math.max(0, Math.round((window.screen.height - h) / 2));
      const popup = window.open(
        url,
        'gatc-zoho-oauth',
        `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`,
      );
      if (!popup) {
        toast('Popup blocked — allow popups for this site, then try again');
        render(true);
        return;
      }
      toast('Complete Zoho Sign-in in the popup…');
      render(true);
      const started = Date.now();
      const poll = setInterval(() => {
        if (popup.closed || Date.now() - started > 12 * 60 * 1000) {
          clearInterval(poll);
          loadZohoStatus(true);
        }
      }, 900);
    }

          <div class="sa-gallery-loading">Loading images…</div>

        return `<div class="sa-gallery" data-action="close-gallery" role="dialog" aria-modal="true" aria-label="Image gallery">

      return `<div class="sa-gallery" data-action="close-gallery" role="dialog" aria-modal="true" aria-label="Image gallery">
        <div class="sa-gallery-bar" data-stop="1"><div><h2>${esc(title)}</h2>${sub ? `<div class="meta">${esc(sub)}</div>` : ''}</div>

    function filenameFromContentDisposition(header) {
      if (!header) return '';
      const star = /filename\*\s*=\s*(?:UTF-8''|utf-8'')([^;]+)/i.exec(header);
      if (star?.[1]) {
        try {
          return decodeURIComponent(star[1].trim().replace(/^"|"$/g, ''));
        } catch (_) { /* ignore */ }
      }
      const plain = /filename\s*=\s*"((?:\\.|[^"\\])*)"|filename\s*=\s*([^;]+)/i.exec(header);
      const raw = (plain?.[1] || plain?.[2] || '').trim().replace(/^"|"$/g, '');
      return raw;
    }

    function safePdfDownloadName(name, fallback = 'certificate.pdf') {
      const raw = String(name || '').trim() || fallback;
      let base = raw.replace(/\.pdf$/i, '').replace(/[\\/]+/g, '-').replace(/[^\w.\-]+/g, '_');
      if (!base) base = 'certificate';
      return `${base}.pdf`;
    }

    async function openCertificatePdf(url, disposition = 'inline', preferredName = '') {
      if (!url) return;
      let target = url;
      if (target.startsWith('/api/') && disposition === 'attachment') {
        target += (target.includes('?') ? '&' : '?') + 'disposition=attachment';
      }
      if (target.startsWith('/api/')) {
        toast(disposition === 'attachment' ? 'Downloading PDF…' : 'Opening PDF…');
        try {
          const res = await fetch(API_BASE + target, {
            headers: { authorization: `Bearer ${authState.token}` },
          });
          if (!res.ok) {
            toast('PDF unavailable');
            return;
          }
          const headerName = filenameFromContentDisposition(res.headers.get('content-disposition'));
          const fileName = safePdfDownloadName(headerName || preferredName || 'certificate.pdf');
          const blob = await res.blob();
          const obj = URL.createObjectURL(blob);
          if (disposition === 'attachment') {
            const a = document.createElement('a');
            a.href = obj;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(obj), 60_000);
          } else {
            window.open(obj, '_blank', 'noopener');
            setTimeout(() => URL.revokeObjectURL(obj), 120_000);
          }
        } catch (_) {
          toast('PDF download failed');
        }
        return;
      }
      window.open(target, '_blank', 'noopener,noreferrer');
    }
